<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"hook1","type":"string","label":"Hook line 1","default":"You pay $20 for the gym."},
    {"id":"hook2","type":"string","label":"Hook line 2","default":"They hope you never come."},
    {"id":"quote1","type":"string","label":"Quote line 1","default":"They sell you the plan."},
    {"id":"quote2a","type":"string","label":"Quote line 2 (before keyword)","default":"You have to"},
    {"id":"quote2b","type":"string","label":"Quote keyword","default":"show up."},
    {"id":"brand","type":"string","label":"Watermark","default":"BUSINESS STICKMAN"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/stickman.js"></script>
    <script src="assets/lib/stickman-props.js"></script>
    <script src="assets/lib/stickman-fx.js"></script>
    <script src="assets/lib/stickman-ui.js"></script>
    <style>
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root { --ink: #eef1f6; --accent: #ffc23d; --muted: #9aa3b3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0c11; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Jakarta", sans-serif; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .lines { position: absolute; left: 60px; right: 60px; top: 250px; text-align: center; color: var(--ink); font-weight: 800; letter-spacing: -0.02em; }
      .lines p { font-size: 66px; line-height: 1.18; }
      .w { display: inline-block; white-space: pre; }
      .key { position: relative; color: var(--accent); text-shadow: 0 0 30px rgba(255, 194, 61, 0.6); }
      .bar { position: absolute; left: 0; right: 0; bottom: -4px; height: 8px; border-radius: 4px; background: var(--accent); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-motion-blur="on" data-motion-blur-events="on" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" data-start="0" data-duration="22" data-track-index="0"></canvas>

      <div id="hook" class="lines clip" data-start="0" data-duration="3.0" data-track-index="1">
        <p id="hook-l1"><span class="w" data-var-text="hook1">You pay $20 for the gym.</span></p>
        <p id="hook-l2" class="key"><span class="w" data-var-text="hook2">They hope you never come.</span></p>
      </div>

      <div id="quote" class="lines clip" data-start="18.4" data-duration="3.6" data-track-index="2">
        <p><span class="w q" data-var-text="quote1">They sell you the plan.</span></p>
        <p><span class="w q" data-var-text="quote2a">You have to</span> <span class="w q key"><span data-var-text="quote2b">show up.</span><span class="bar"></span></span></p>
      </div>

      <audio id="sfx-zoom" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.65" data-duration="0.57" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-jan" class="clip" src="assets/sfx/pop.mp3" data-start="3.4" data-duration="0.72" data-track-index="6" data-volume="0.28"></audio>
      <audio id="sfx-m0" class="clip" src="assets/sfx/ping.mp3" data-start="3.7" data-duration="1.32" data-track-index="7" data-volume="0.25"></audio>
      <audio id="sfx-feb" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.95" data-duration="0.57" data-track-index="8" data-volume="0.25"></audio>
      <audio id="sfx-m1" class="clip" src="assets/sfx/ping.mp3" data-start="5.3" data-duration="1.32" data-track-index="7" data-volume="0.25"></audio>
      <audio id="sfx-mar" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="6.55" data-duration="0.57" data-track-index="8" data-volume="0.25"></audio>
      <audio id="sfx-m2" class="clip" src="assets/sfx/ping.mp3" data-start="6.9" data-duration="1.32" data-track-index="7" data-volume="0.25"></audio>
      <audio id="sfx-apr" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.15" data-duration="0.57" data-track-index="8" data-volume="0.25"></audio>
      <audio id="sfx-m3" class="clip" src="assets/sfx/ping.mp3" data-start="8.5" data-duration="1.32" data-track-index="7" data-volume="0.25"></audio>
      <audio id="sfx-s2" class="clip" src="assets/sfx/whoosh.mp3" data-start="9.6" data-duration="0.57" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-r1" class="clip" src="assets/sfx/click-soft.mp3" data-start="10.2" data-duration="0.37" data-track-index="9" data-volume="0.45"></audio>
      <audio id="sfx-r2" class="clip" src="assets/sfx/click-soft.mp3" data-start="10.75" data-duration="0.37" data-track-index="9" data-volume="0.45"></audio>
      <audio id="sfx-r3" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.3" data-duration="0.37" data-track-index="9" data-volume="0.45"></audio>
      <audio id="sfx-r4" class="clip" src="assets/sfx/click-soft.mp3" data-start="11.85" data-duration="0.37" data-track-index="9" data-volume="0.45"></audio>
      <audio id="sfx-r5" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.4" data-duration="0.37" data-track-index="9" data-volume="0.45"></audio>
      <audio id="sfx-profit" class="clip" src="assets/sfx/sparkle.mp3" data-start="13.0" data-duration="1.8" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-s3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="13.8" data-duration="0.57" data-track-index="8" data-volume="0.28"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="13.9" data-duration="2.4" data-track-index="11" data-volume="0.14"></audio>
      <audio id="sfx-room" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="15.0" data-duration="1.2" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-big" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="16.3" data-duration="2.1" data-track-index="13" data-volume="0.45"></audio>
      <audio id="sfx-shine" class="clip" src="assets/sfx/sparkle.mp3" data-start="16.35" data-duration="1.8" data-track-index="10" data-volume="0.3"></audio>
      <audio id="sfx-quote" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="18.45" data-duration="0.57" data-track-index="14" data-volume="0.28"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 22;
      const { W, H, C, E, clamp, lerp, tw, kf, rng } = SM;
      const FX = SM.fx, UI = SM.ui;
      let BRAND = "BUSINESS STICKMAN";

      // numbers: videos/13-gym-money/numbers.json (checked with business-math)
      const SPLIT = [["Rent", 4, "#7d86c9"], ["Staff", 3, C.teal], ["Machines", 3, "#b7a6ff"], ["Power & water", 2, "#5b8fd0"], ["Cleaning & other", 2, C.other]];
      const PROFIT = 6, PX = 40;
      const S1 = 3.0, S2 = 9.6, S3 = 13.8, Q = 18.4;
      const MONTHS = [["JANUARY", 3.4], ["FEBRUARY", 5.0], ["MARCH", 6.6], ["APRIL", 8.2]];
      const GY = 1240;
      // who works out in January, and when they stop coming
      const SLOTS = [
        { x: 150, kind: "run", leave: 5.0, ph: 0.0 },
        { x: 330, kind: "run", leave: 8.2, ph: 1.7 },
        { x: 510, kind: "run", leave: 6.6, ph: 3.1 },
        { x: 705, kind: "press", leave: 99, ph: 0.0, hero: true },
        { x: 905, kind: "curl", leave: 5.0, ph: 2.2 },
      ];
      const usd = (n) => "$" + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

      function treadmill(ctx, x, y, s, t, run) {
        ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
        SM.box(ctx, -95, -36, 190, 28, 12, "#2b303b", 5);
        ctx.save(); SM.rr(ctx, -88, -34, 170, 10, 4); ctx.clip();
        ctx.fillStyle = "#151920"; ctx.fillRect(-88, -34, 170, 10);
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        const off = (t * 320 * run) % 34;
        for (let i = -1; i < 7; i++) ctx.fillRect(-88 + i * 34 - off, -32, 14, 4);
        ctx.restore();
        ctx.lineCap = "round"; ctx.strokeStyle = C.out; ctx.lineWidth = 16;
        ctx.beginPath(); ctx.moveTo(78, -30); ctx.lineTo(96, -176); ctx.moveTo(96, -150); ctx.lineTo(40, -142); ctx.stroke();
        ctx.strokeStyle = "#4a5263"; ctx.lineWidth = 9; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(78, -30); ctx.lineTo(96, -176); ctx.stroke();
        SM.box(ctx, 66, -206, 66, 38, 8, "#1d2230", 5);
        if (run > 0.05) { SM.glow(ctx, 99, -187, 60, "#8fc7ff", 0.5 * run); SM.box(ctx, 74, -198, 50, 22, 4, SM.withA("#8fc7ff", 0.7 * run), 0); }
        ctx.restore();
      }
      function dumbbell(ctx, x, y, s = 1) {
        ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
        SM.box(ctx, -18, -4, 36, 8, 3, "#9aa3b3", 4);
        SM.box(ctx, -26, -12, 10, 24, 4, "#3b4252", 4);
        SM.box(ctx, 16, -12, 10, 24, 4, "#3b4252", 4);
        ctx.restore();
      }
      function person(ctx, sl, t, ghost) {
        const live = 1 - ghost;
        const col = SM.mixColor(sl.hero ? C.hero : C.other, C.dim, ghost);
        const alpha = lerp(1, 0.16, ghost);
        let pose, f;
        if (sl.kind === "run") {
          treadmill(ctx, sl.x, GY, 0.95, t + sl.ph, live);
          pose = SM.poseMix(SM.POSE.stand, SM.walk(t * 11 + sl.ph, 1.1), live);
          f = SM.stickman(ctx, { x: sl.x - 12, y: GY - 32 - Math.abs(Math.sin(t * 11 + sl.ph)) * 6 * live, s: 0.95, face: 1, pose, color: col, alpha });
          return f;
        }
        const k = 0.5 - 0.5 * Math.cos(t * 3.1 + sl.ph);
        if (sl.kind === "press") {
          const u = lerp(1.55, 2.75, k), fo = lerp(3.1, 2.95, k);
          pose = { lean: 0, head: -0.1, aB: [-u, -fo], aF: [u, fo], lB: [0.2, 0.05], lF: [-0.2, -0.05] };
        } else {
          pose = { lean: 0.04, head: 0.2, aB: [0.12, lerp(0.3, 2.4, 1 - k)], aF: [0.18, lerp(0.3, 2.5, k)], lB: [0.14, 0.02], lF: [-0.14, -0.02] };
          pose = SM.poseMix(SM.POSE.stand, pose, live);
        }
        f = SM.stickman(ctx, { x: sl.x, y: GY, s: 1.05, face: -1, pose, color: col, alpha, glowA: sl.hero ? 0.15 : 0 });
        if (f) {
          ctx.save(); ctx.globalAlpha *= alpha;
          dumbbell(ctx, f.handF[0], f.handF[1], 1.1); dumbbell(ctx, f.handB[0], f.handB[1], 1.1);
          ctx.restore();
        }
        return f;
      }

      // ---- outside: the gym at night, you and your card ----
      function outside(ctx, t) {
        SM.city(ctx, GY - 40, t * 6, 1, 23, 0.2, "#1b1f2c");
        SM.box(ctx, 300, 650, 720, 590, 14, C.building, 6);
        SM.box(ctx, 300, 650, 720, 40, 14, C.buildingDark, 0);
        // sign
        SM.glow(ctx, 660, 600, 360, C.amber, 0.35);
        SM.box(ctx, 500, 552, 320, 96, 22, "#1d2230", 6);
        SM.text(ctx, "GYM", 660, 602, { size: 58, color: C.amber });
        UI.ico(ctx, "dumbbell", 548, 600, 0.9); UI.ico(ctx, "dumbbell", 772, 600, 0.9);
        // big window with people running inside
        SM.box(ctx, 340, 790, 440, 330, 12, "#2a2a2e", 6);
        ctx.save(); SM.rr(ctx, 346, 796, 428, 318, 8); ctx.clip();
        const g = ctx.createLinearGradient(0, 796, 0, 1114); g.addColorStop(0, "#5a4a36"); g.addColorStop(1, "#8a6a42");
        ctx.fillStyle = g; ctx.fillRect(346, 796, 428, 318);
        for (let i = 0; i < 3; i++) {
          treadmill(ctx, 430 + i * 130, 1112, 0.55, t + i, 1);
          SM.stickman(ctx, { x: 423 + i * 130, y: 1094, s: 0.55, face: 1, pose: SM.walk(t * 11 + i * 1.3, 1.1), color: "#2b2620" });
        }
        ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.beginPath(); ctx.moveTo(380, 796); ctx.lineTo(470, 796); ctx.lineTo(380, 900); ctx.closePath(); ctx.fill();
        ctx.restore();
        // door
        SM.box(ctx, 830, 960, 140, 280, 10, "#2e3543", 6);
        SM.box(ctx, 846, 980, 108, 240, 6, SM.withA("#8fc7ff", 0.12), 0);
        SM.box(ctx, 932, 1080, 10, 50, 4, C.other, 0);
        SM.glow(ctx, 560, 1240, 520, "#ffb35c", 0.18);
        // you, holding the card up
        const fig = SM.stickman(ctx, { x: 170, y: GY, s: 1.1, face: 1, pose: { lean: -0.04, head: -0.25, aB: [0.25, 0.1], aF: [2.75, 2.9 + Math.sin(t * 2) * 0.03], lB: [0.14, 0.02], lF: [-0.14, -0.02] }, color: C.hero });
        const cx = fig.handF[0] + 34, cy = fig.handF[1] - 92 + Math.sin(t * 2.4) * 4;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.06 + Math.sin(t * 1.7) * 0.02);
        SM.glow(ctx, 0, 0, 220, C.amber, 0.45);
        SM.box(ctx, -125, -78, 250, 156, 18, "#1d2b36", 6);
        ctx.save(); SM.rr(ctx, -122, -75, 244, 44, 15); ctx.clip(); ctx.fillStyle = C.teal; ctx.fillRect(-122, -75, 244, 44); ctx.restore();
        SM.label(ctx, "GYM MEMBER", 0, -52, { size: 20, color: C.paper, spacing: 0.2 });
        SM.text(ctx, "$20", -40, 18, { size: 62, color: C.amber });
        SM.label(ctx, "/ MONTH", 62, 24, { size: 18, color: C.text, spacing: 0.12 });
        ctx.restore();
      }

      // ---- inside: the gym floor ----
      function inside(ctx, t) {
        const g = ctx.createLinearGradient(0, 640, 0, GY);
        g.addColorStop(0, "#1a1f2a"); g.addColorStop(1, "#232937");
        ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, GY + 200);
        // light strip and mirrors
        SM.box(ctx, 60, 690, 960, 14, 7, "#3a4152", 0);
        SM.glow(ctx, 540, 700, 700, "#ffe2b0", 0.12);
        for (let i = 0; i < 4; i++) {
          const x = 80 + i * 232;
          SM.rr(ctx, x, 740, 222, 380, 10); ctx.fillStyle = "rgba(160,190,230,0.06)"; ctx.fill();
          ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.07)"; ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,0.035)"; ctx.beginPath(); ctx.moveTo(x + 40, 740); ctx.lineTo(x + 110, 740); ctx.lineTo(x + 20, 900); ctx.lineTo(x, 900); ctx.closePath(); ctx.fill();
        }
        SM.groundStrip(ctx, GY, 700);
        // the one who keeps coming gets a warm light at the end
        const spot = tw(t, Q - 0.4, Q + 1.4, E.out);
        if (spot > 0) { ctx.globalCompositeOperation = "lighter"; SM.glow(ctx, 705, 1060, 420, C.amber, 0.28 * spot); ctx.globalCompositeOperation = "source-over"; }
        SLOTS.forEach((sl) => person(ctx, sl, t, tw(t, sl.leave, sl.leave + 0.8, E.inOut)));
        // empty spots keep paying: +$20 above every ghost each month
        MONTHS.slice(1).forEach(([, m]) => SLOTS.forEach((sl) => {
          if (sl.leave > m) return;
          const k = tw(t, m + 0.35, m + 1.35, E.out);
          if (k > 0 && k < 1) SM.text(ctx, "+$20", sl.x, GY - 260 - k * 90, { size: 34, color: C.amber, alpha: 1 - k * k });
        }));
      }

      function draw(ctx, t) {
        SM.background(ctx);
        const hh = FX.handheld(t, 0.7);
        ctx.save(); ctx.translate(hh.dx, hh.dy);

        // outside → zoom through the window
        const zin = tw(t, 2.6, 3.4, E.inOut);
        const outA = 1 - tw(t, 3.0, 3.4);
        if (outA > 0) {
          ctx.save(); ctx.globalAlpha *= outA;
          SM.camera(ctx, { x: lerp(540, 560, zin), y: lerp(960, 955, zin), z: lerp(1 + t * 0.02, 2.8, zin * zin) });
          outside(ctx, t);
          ctx.restore();
        }
        const inA = tw(t, 2.95, 3.4);
        if (inA > 0) {
          const end = tw(t, Q - 0.4, Q + 2.2, E.inOut);
          ctx.save(); ctx.globalAlpha *= inA;
          SM.camera(ctx, { x: lerp(540, 705, end), y: lerp(960, 1090, end), sy: lerp(960, 1150, end), z: lerp(1.2, 1, tw(t, 2.95, 4.2, E.out)) * lerp(1, 1.3, end) });
          inside(ctx, t);
          ctx.restore();
        }

        // ---- the months go by ----
        const s1 = tw(t, S1 + 0.3, S1 + 0.7) * (1 - tw(t, S2 - 0.2, S2 + 0.2));
        if (s1 > 0) {
          ctx.save(); ctx.globalAlpha *= s1;
          let mi = 0;
          MONTHS.forEach(([, m], i) => { if (t >= m) mi = i; });
          const [name, m0] = MONTHS[mi];
          const flip = tw(t, m0, m0 + 0.35, E.back);
          SM.pill(ctx, name, W / 2, 320, { size: 36, bg: "#262b36", fg: C.hero, scale: lerp(0.8, 1, flip) });
          const paid = 20000 * mi + 20000 * tw(t, m0 + 0.3, m0 + 0.9, E.out);
          const pop = t >= m0 + 0.3 && t < m0 + 0.9 ? 1 + 0.06 * Math.sin(((t - m0 - 0.3) / 0.6) * Math.PI) : 1;
          UI.bigNumber(ctx, usd(paid), "PAID SO FAR · 1,000 MEMBERS × $20", W / 2, 470, 1, { size: 96 * pop, color: C.amber, glowA: 0.35 });
          SM.label(ctx, "THEY STOP COMING. THEY KEEP PAYING.", W / 2, 640, { size: 24, color: C.text, spacing: 0.14, alpha: tw(t, 5.5, 6.0) });
          ctx.restore();
        }

        // dim the gym behind the cards
        const dim = tw(t, S2, S2 + 0.5) * (1 - tw(t, Q - 0.4, Q + 0.4));
        if (dim > 0) { ctx.fillStyle = `rgba(10,12,17,${0.82 * dim})`; ctx.fillRect(-100, -100, W + 200, H + 200); }

        // ---- where your $20 goes ----
        const s2 = tw(t, S2 + 0.2, S2 + 0.7, E.outQuint) * (1 - tw(t, S3 - 0.3, S3 + 0.1));
        if (s2 > 0) {
          ctx.save(); ctx.globalAlpha *= s2;
          SM.pill(ctx, "WHERE YOUR $20 GOES", W / 2, 330, { size: 34, bg: "#262b36", fg: C.hero });
          const bx = W / 2 - 10 * PX, by = 440, bh = 72;
          SM.rr(ctx, bx, by, 20 * PX, bh, 18); ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fill();
          ctx.save(); SM.rr(ctx, bx, by, 20 * PX, bh, 18); ctx.clip();
          let x = bx;
          [...SPLIT, ["Profit", PROFIT, C.amber]].forEach(([, v, c], i) => {
            const t0 = i < 5 ? 10.2 + i * 0.55 : 13.0;
            const k = tw(t, t0, t0 + 0.5, E.outQuint);
            if (k > 0) { ctx.fillStyle = c; ctx.fillRect(x + 2, by, v * PX * k - 4, bh); }
            x += v * PX;
          });
          ctx.restore();
          SPLIT.forEach(([n, v, c], i) => UI.row(ctx, 160, 610 + i * 86, 760, n, "$" + v, c, tw(t, 10.2 + i * 0.55, 10.7 + i * 0.55, E.lin), { size: 30 }));
          UI.row(ctx, 160, 610 + 5 * 86 + 14, 760, "PROFIT PER MEMBER", "$6", C.amber, tw(t, 13.0, 13.5, E.lin), { size: 34, strong: true });
          ctx.restore();
          FX.burst(ctx, bx + 17 * PX, by, t, 13.05, { n: 14, kind: "coin", speed: 520, size: 8, life: 0.9, gravity: 500, spread: 1.3, seed: 4 });
        }

        // ---- the secret: 1,000 members, room for 100 ----
        const s3 = tw(t, S3 + 0.1, S3 + 0.5, E.outQuint) * (1 - tw(t, Q - 0.4, Q));
        if (s3 > 0) {
          ctx.save(); ctx.globalAlpha *= s3;
          const msg = t < 15.0 ? "1,000 MEMBERS PAY" : t < 16.3 ? "THE GYM FITS 100" : "MOST NEVER COME";
          const m0 = t < 15.0 ? S3 : t < 16.3 ? 15.0 : 16.3;
          SM.pill(ctx, msg, W / 2, 330, { size: 34, bg: "#262b36", fg: t >= 16.3 ? C.amber : C.hero, scale: lerp(0.85, 1, tw(t, m0, m0 + 0.35, E.back)) });
          const cols = 40, rows = 25, sp = 18, gx = W / 2 - (cols - 1) * sp / 2, gy = 450;
          const room = tw(t, 15.0, 15.5, E.inOut);
          const inBox = (c, r) => c >= 15 && c < 25 && r >= 8 && r < 18;
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            const i = r * cols + c;
            const t0 = S3 + 0.15 + (i / 1000) * 0.9;
            const k = t >= t0 ? tw(t, t0, t0 + 0.25, E.back) : 0;
            if (k <= 0) continue;
            const inside = inBox(c, r);
            ctx.globalAlpha = s3 * (inside ? 1 : lerp(1, 0.2, room));
            ctx.fillStyle = inside ? SM.mixColor(C.other, C.hero, room) : SM.mixColor(C.other, C.dim, room);
            ctx.beginPath(); ctx.arc(gx + c * sp, gy + r * sp, 6 * k, 0, Math.PI * 2); ctx.fill();
          }
          ctx.globalAlpha = s3;
          SM.label(ctx, "1,000 MEMBERS", W / 2, gy + rows * sp + 16, { size: 22, color: C.label, alpha: tw(t, S3 + 0.6, S3 + 1.0) });
          if (room > 0) {
            const bk = t >= 15.0 ? E.back(clamp((t - 15.0) / 0.5)) : 0;
            const x0 = gx + 15 * sp - 14, y0 = gy + 8 * sp - 14, bw = 9 * sp + 28;
            ctx.save(); ctx.translate(x0 + bw / 2, y0 + bw / 2); ctx.scale(bk, bk);
            SM.glow(ctx, 0, 0, 260, C.amber, 0.3);
            SM.rr(ctx, -bw / 2, -bw / 2, bw, bw, 14); ctx.lineWidth = 5; ctx.strokeStyle = C.amber; ctx.stroke();
            ctx.restore();
            SM.label(ctx, "ROOM FOR 100", x0 + bw / 2, y0 - 26, { size: 22, color: C.amber, alpha: room });
          }
          const big = t >= 16.3 ? tw(t, 16.3, 16.75, E.back) : 0;
          if (big > 0) {
            FX.rays(ctx, W / 2, 1050, t, big * 0.45);
            FX.ring(ctx, W / 2, 1050, t, 16.3);
            FX.burst(ctx, 110, 1060, t, 16.35, { n: 14, kind: "coin", speed: 700, size: 9, life: 1.3, dir: -2.2, spread: 1.0, seed: 9 });
            FX.burst(ctx, 970, 1060, t, 16.35, { n: 14, kind: "coin", speed: 700, size: 9, life: 1.3, dir: -0.95, spread: 1.0, seed: 3 });
            UI.bigNumber(ctx, "$6,000 a month", "PROFIT · 1,000 × $6", W / 2, 1050, clamp(big * 2), { size: 92 * lerp(1, 1.06, Math.sin(clamp((t - 16.3) / 0.5) * Math.PI)), color: C.amber, glowA: 0.6 });
          }
          ctx.restore();
        }
        ctx.restore();

        FX.leak(ctx, t, 0.1 + tw(t, 16.3, 16.7) * 0.22 * (1 - tw(t, 17.6, 18.6)));

        // chrome
        UI.topic(ctx, "HOW A GYM MAKES MONEY", 196, tw(t, S1, S1 + 0.4) * (1 - tw(t, Q - 0.3, Q)));
        SM.label(ctx, "EXAMPLE GYM · NUMBERS DIFFER BY CITY AND SIZE", W / 2, 1360, { size: 15, color: "rgba(255,255,255,0.45)", spacing: 0.12, alpha: tw(t, S1 + 0.4, S1 + 0.8) * (1 - tw(t, Q - 0.3, Q)) });
        SM.label(ctx, BRAND, W / 2, 1640, { size: 16, color: "rgba(255,255,255,0.2)", spacing: 0.5 });
        SM.vignette(ctx, 0.65);
        SM.grain(ctx, t, 0.05);
      }

      document.fonts.load('800 40px "Jakarta"').then(() => {
        try { const v = window.__hyperframes.getVariables(); if (v && v.brand) BRAND = v.brand; } catch (e) {}
        tl.fromTo("#hook-l1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
        tl.fromTo("#hook-l2", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.6);
        tl.fromTo("#hook p", { opacity: 1, y: 0 }, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.4, ease: "power3.in", stagger: 0.06 }, 2.45);
        tl.fromTo("#quote .q", { opacity: 0, filter: "blur(12px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.55, ease: "power4.out", stagger: 0.3 }, 18.5);
        tl.fromTo("#quote .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 19.4);
        SM.mount("stage", DUR, draw, tl);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
