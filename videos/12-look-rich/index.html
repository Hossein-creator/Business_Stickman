<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"hook1","type":"string","label":"Hook line 1","default":"You have $100 a month."},
    {"id":"hook2","type":"string","label":"Hook line 2","default":"Look rich, or get rich?"},
    {"id":"quote1","type":"string","label":"Quote line 1","default":"You can look rich,"},
    {"id":"quote2a","type":"string","label":"Quote line 2 (before keyword)","default":"or"},
    {"id":"quote2b","type":"string","label":"Quote keyword","default":"get rich."},
    {"id":"brand","type":"string","label":"Watermark","default":"BUSINESS STICKMAN"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/stickman.js"></script>
    <script src="assets/lib/stickman-props.js"></script>
    <script src="assets/lib/stickman-fx.js"></script>
    <script src="assets/lib/stickman-ui.js"></script>
    <style>
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root { --ink: #eef1f6; --accent: #ffc23d; --muted: #9aa3b3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0c11; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Jakarta", sans-serif; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .lines { position: absolute; left: 60px; right: 60px; top: 250px; text-align: center; color: var(--ink); font-weight: 800; letter-spacing: -0.02em; }
      .lines p { font-size: 70px; line-height: 1.16; }
      .lines p.big { font-size: 96px; }
      .w { display: inline-block; white-space: pre; }
      .key { position: relative; color: var(--accent); text-shadow: 0 0 30px rgba(255, 194, 61, 0.6); }
      .bar { position: absolute; left: 0; right: 0; bottom: -4px; height: 8px; border-radius: 4px; background: var(--accent); transform-origin: left center; }
      .soft { color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-motion-blur="on" data-motion-blur-events="on" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" data-start="0" data-duration="22" data-track-index="0"></canvas>

      <div id="hook" class="lines clip" data-start="0" data-duration="3.0" data-track-index="1">
        <p id="hook-l1"><span class="w" data-var-text="hook1">You have $100 a month.</span></p>
        <p id="hook-l2" class="key"><span class="w" data-var-text="hook2">Look rich, or get rich?</span></p>
      </div>

      <div id="quote" class="lines clip" data-start="18.4" data-duration="3.6" data-track-index="2">
        <p class="soft"><span class="w q" data-var-text="quote1">You can look rich,</span></p>
        <p class="big"><span class="w q" data-var-text="quote2a">or</span> <span class="w q key"><span data-var-text="quote2b">get rich.</span><span class="bar"></span></span></p>
      </div>

      <audio id="sfx-split" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.9" data-duration="0.6" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-m1" class="clip" src="assets/sfx/click-soft.mp3" data-start="3.4" data-duration="0.37" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-m2" class="clip" src="assets/sfx/click-soft.mp3" data-start="4.75" data-duration="0.37" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-m3" class="clip" src="assets/sfx/click-soft.mp3" data-start="6.1" data-duration="0.37" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-m4" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.45" data-duration="0.37" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-y1" class="clip" src="assets/sfx/ping.mp3" data-start="8.8" data-duration="1.32" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-crack" class="clip" src="assets/sfx/error.mp3" data-start="9.6" data-duration="0.6" data-track-index="8" data-volume="0.25"></audio>
      <audio id="sfx-cart" class="clip" src="assets/sfx/sparkle.mp3" data-start="9.7" data-duration="1.8" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-y2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="11.0" data-duration="0.6" data-track-index="5" data-volume="0.28"></audio>
      <audio id="sfx-new" class="clip" src="assets/sfx/notification.mp3" data-start="11.2" data-duration="1.0" data-track-index="10" data-volume="0.3"></audio>
      <audio id="sfx-e1" class="clip" src="assets/sfx/pop.mp3" data-start="12.0" data-duration="0.72" data-track-index="11" data-volume="0.22"></audio>
      <audio id="sfx-e2" class="clip" src="assets/sfx/pop.mp3" data-start="13.0" data-duration="0.72" data-track-index="12" data-volume="0.22"></audio>
      <audio id="sfx-e3" class="clip" src="assets/sfx/pop.mp3" data-start="14.0" data-duration="0.72" data-track-index="11" data-volume="0.22"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="5.6" data-duration="10.03" data-track-index="13" data-volume="0.15"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="15.6" data-duration="2.12" data-track-index="14" data-volume="0.45"></audio>
      <audio id="sfx-quote" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="18.45" data-duration="0.6" data-track-index="15" data-volume="0.28"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 22;
      const { W, H, C, E, clamp, lerp, tw, kf, rng } = SM;
      const FX = SM.fx, UI = SM.ui;
      let BRAND = "BUSINESS STICKMAN";

      // same $100 a month: a $1,200 phone on 12 installments vs. 12 months of saving -> a coffee cart
      const GY = 1110, XL = 270, XR = 810;
      const Y1 = 3.4, MSTEP = 0.45, BUY = 9.2, Y2 = 11.0, M2STEP = 0.33, SUM = 15.4, Q = 18.4;
      const money = (n) => "$" + Math.round(n).toLocaleString("en-US");

      function months1(t) { return clamp(Math.floor((t - Y1) / MSTEP) + 1, 0, 12); }
      function months2(t) { return clamp(Math.floor((t - Y2 - 0.4) / M2STEP) + 1, 0, 12); }

      // phone with a price glow; crack 0..1, col = case colour
      function bigPhone(ctx, x, y, s, crack, col, shine) {
        ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
        if (shine > 0) SM.glow(ctx, 0, 0, 120, "#8fc7ff", shine * 0.7);
        SM.box(ctx, -26, -46, 52, 92, 10, col, 5);
        SM.rr(ctx, -20, -38, 40, 74, 6); ctx.fillStyle = SM.mixColor("#9fd0ff", "#3a4250", crack); ctx.fill();
        if (crack > 0) { ctx.strokeStyle = SM.withA("#ffffff", 0.8 * crack); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-14, -30); ctx.lineTo(2, -6); ctx.lineTo(-8, 8); ctx.lineTo(10, 30); ctx.moveTo(2, -6); ctx.lineTo(16, -14); ctx.stroke(); }
        ctx.restore();
      }

      function draw(ctx, t) {
        SM.background(ctx, "#151922", "#08090d");
        const hh = FX.handheld(t, 0.6);
        const endK = tw(t, Q - 0.4, Q + 0.4, E.inOut);
        const split = tw(t, 2.9, 3.5, E.outQuint);
        ctx.save(); ctx.translate(hh.dx, hh.dy);

        // halves: left cool/red, right warm
        ctx.save(); ctx.globalAlpha *= 1 - endK;
        SM.glow(ctx, XL, 900, 520, C.coral, 0.12);
        SM.glow(ctx, XR, 900, 520, C.amber, 0.12 + tw(t, BUY, BUY + 1) * 0.12);
        SM.groundStrip(ctx, GY, 700);
        // divider
        ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fillRect(538, lerp(GY, 420, split), 4, lerp(0, GY - 420 + 260, split));
        SM.label(ctx, "LOOK RICH", XL, 440, { size: 32, color: C.coral, alpha: split });
        SM.label(ctx, "GET RICH", XR, 440, { size: 32, color: C.amber, alpha: split });

        // ---------- LEFT: installments ----------
        const m1 = months1(t), m2 = months2(t);
        const paidBills = t < Y2 ? m1 : m2;
        const newPhone = t > Y2 + 0.2;
        const crack = tw(t, BUY + 0.4, BUY + 0.8) * (1 - tw(t, Y2, Y2 + 0.3));
        const jl = SM.stickman(ctx, { x: XL + 70, y: GY, s: 1.2, face: -1, pose: { ...SM.POSE.phone, head: 0.35 + Math.sin(t * 2) * 0.05 }, color: C.hero });
        const pop = newPhone ? E.back(tw(t, Y2 + 0.2, Y2 + 0.6, E.lin)) : 1;
        bigPhone(ctx, jl.handF[0] - 6, jl.handF[1] - 30, 1.3 * Math.max(0.01, pop), crack, newPhone ? "#c9634f" : "#7d86c9", t < BUY ? 1 : newPhone ? 1 : 0.2);
        // a pile of paid bills
        for (let i = 0; i < paidBills; i++) {
          const t0 = (t < Y2 ? Y1 : Y2 + 0.4) + i * (t < Y2 ? MSTEP : M2STEP);
          const k = tw(t, t0, t0 + 0.3, E.outQuint);
          const r = rng(i * 5 + (t < Y2 ? 0 : 50));
          SM.bill(ctx, lerp(XL - 100, XL - 135 + r() * 30, k), lerp(GY - 500, GY - 50 - i * 24, k), 0.9, (r() - 0.5) * 0.3, "−$100");
        }
        // left money line
        const paid = t < Y2 ? m1 * 100 : 1200 + m2 * 100;
        UI.bigNumber(ctx, "−" + money(paid), "PAID FOR PHONES", XL, 1220, split * (1 - tw(t, SUM, SUM + 0.4)), { size: 64, color: C.coral, glowA: 0 });
        // phone value after a year
        const worth = Math.round(lerp(1200, 500, tw(t, BUY + 0.2, BUY + 1.2, E.out)));
        SM.pill(ctx, "NOW WORTH " + money(worth), XL, 560, { size: 28, bg: "#3a2326", fg: C.coral, scale: Math.max(0.001, E.back(tw(t, BUY, BUY + 0.4, E.lin))), alpha: tw(t, BUY, BUY + 0.2) * (1 - tw(t, Y2 - 0.2, Y2)) });
        if (newPhone) SM.fx.ring(ctx, jl.handF[0], jl.handF[1] - 30, t, Y2 + 0.2, { r1: 260, color: "#ffb3a6" });
        SM.toast(ctx, XL, 560, "NEW MODEL! 12 × $100", tw(t, Y2 + 0.3, Y2 + 0.7, E.lin) * (1 - tw(t, SUM - 0.3, SUM)), { col: C.coral, w: 400 });

        // ---------- RIGHT: save, then buy a cart ----------
        const toCart = tw(t, BUY + 0.2, BUY + 1.0, E.inOut);
        const jr = SM.stickman(ctx, { x: XR - 110, y: GY, s: 1.2, pose: t < BUY ? SM.poseMix(SM.POSE.stand, SM.POSE.give, 0.5 + 0.5 * Math.sin((t - Y1) / MSTEP * Math.PI * 2)) : SM.POSE.proud, color: C.hero, glowA: tw(t, BUY + 0.6, BUY + 1.2) * 0.35 });
        if (toCart < 1) {
          ctx.save(); ctx.globalAlpha *= 1 - toCart;
          SM.jar(ctx, XR + 90, GY, 1.45 * (1 - toCart * 0.5), clamp(m1 / 12), t, m1 >= 12 ? 0.4 : 0);
          // coin into the jar each month
          if (t > Y1 && t < BUY) { const ph = ((t - Y1) / MSTEP) % 1; SM.coin(ctx, lerp(jr.handF[0], XR + 90, ph), lerp(jr.handF[1], GY - 245, ph) - Math.sin(ph * Math.PI) * 50, 16, t * 8, 1 - ph * ph); }
          ctx.restore();
        }
        if (toCart > 0) SM.cart(ctx, XR + 100, GY, 0.95, { awning: toCart, sign: toCart > 0.6 ? "KOPI" : null, light: toCart, t });
        FX.burst(ctx, XR + 100, GY - 160, t, BUY + 0.3, { n: 30, kind: "spark", speed: 700, size: 7, life: 1.2, seed: 9 });
        SM.pill(ctx, "BOUGHT A COFFEE CART", XR, 560, { size: 26, bg: C.amber, fg: "#2a1c00", scale: Math.max(0.001, E.back(tw(t, BUY + 0.5, BUY + 0.9, E.lin))), alpha: tw(t, BUY + 0.5, BUY + 0.7) * (1 - tw(t, Y2 - 0.2, Y2)) });
        SM.pill(ctx, "+$300 EVERY MONTH", XR, 560, { size: 26, bg: "#3a3220", fg: C.amber, alpha: tw(t, Y2 + 0.3, Y2 + 0.6) * (1 - tw(t, SUM - 0.3, SUM)) });
        // year 2: money comes back
        if (t > Y2 + 0.4 && t < SUM) { const ph = ((t - Y2 - 0.4) / M2STEP) % 1; SM.coin(ctx, lerp(XR + 100, jr.handF[0], ph), lerp(GY - 230, jr.handF[1], ph) - Math.sin(ph * Math.PI) * 60, 16, t * 8, 1 - ph * ph * 0.5); }
        const rightNum = t < Y2 ? m1 * 100 : m2 * 300;
        UI.bigNumber(ctx, (t < Y2 ? "" : "+") + money(rightNum), t < Y2 ? "SAVED" : "EARNED IN YEAR 2", XR, 1220, split * (1 - tw(t, SUM, SUM + 0.4)), { size: 64, color: t < Y2 ? C.hero : C.amber, glowA: 0 });

        // month pill
        const yr = t < Y2 ? 1 : 2, mm = t < Y2 ? m1 : m2;
        SM.pill(ctx, "YEAR " + yr + " · MONTH " + Math.max(1, mm), W / 2, 340, { size: 28, bg: "#262b36", fg: C.hero, alpha: tw(t, Y1 - 0.3, Y1) * (1 - tw(t, SUM - 0.3, SUM)) });

        // ---------- summary after two years ----------
        const sk = tw(t, SUM, SUM + 0.5, E.outQuint);
        if (sk > 0) {
          ctx.fillStyle = `rgba(10,12,17,${0.5 * sk})`; ctx.fillRect(0, 0, 538, GY);
          const big = t >= SUM + 0.2 ? tw(t, SUM + 0.2, SUM + 0.6, E.back) : 0;
          UI.bigNumber(ctx, "$700", "2 USED PHONES", XL, 640, sk, { size: 84, color: C.other, glowA: 0 });
          UI.bigNumber(ctx, "$3,600", "A YEAR · AND A CART", XR, 640, sk, { size: 84 * lerp(1, 1.06, Math.sin(clamp((t - SUM - 0.2) / 0.5) * Math.PI)), color: C.amber, glowA: big * 0.55 });
          SM.label(ctx, "AFTER 2 YEARS", W / 2, 340, { size: 26, color: C.text, alpha: sk });
          FX.rays(ctx, XR, 640, t, sk * 0.4 * (1 - tw(t, Q - 0.5, Q)), "#ffd27a", 12, 520);
        }
        ctx.restore();
        FX.burst(ctx, XR, 640, t, SUM + 0.25, { n: 28, kind: "coin", speed: 700, size: 8, life: 1.4, seed: 3 });

        // ---------- ending: the cart, open for business ----------
        if (endK > 0) {
          ctx.save(); ctx.globalAlpha *= endK;
          SM.glow(ctx, 540, 1000, 600, C.amber, 0.35);
          SM.groundStrip(ctx, 1240, 700);
          SM.cart(ctx, 620, 1240, 1.2, { awning: 1, sign: "KOPI", light: 1, t });
          SM.stickman(ctx, { x: 360, y: 1240, pose: SM.POSE.proud, color: C.hero, glowA: 0.3 });
          SM.stickman(ctx, { x: 900, y: 1240, face: -1, pose: SM.POSE.give, color: C.other });
          for (let i = 0; i < 6; i++) { const ph = ((t * 0.8 + i / 6) % 1); SM.coin(ctx, lerp(900, 400, ph), 1000 - Math.sin(ph * Math.PI) * 140, 12, t * 6 + i, 1 - ph * 0.4); }
          ctx.restore();
        }
        ctx.restore();

        // chrome
        UI.topic(ctx, "SAME $100 A MONTH", 196, tw(t, 3.0, 3.4));
        SM.label(ctx, "EXAMPLE NUMBERS · RESALE AND PROFIT VARY", W / 2, 1360, { size: 15, color: "rgba(255,255,255,0.45)", spacing: 0.12, alpha: tw(t, 3.4, 3.8) * (1 - tw(t, Q - 0.3, Q)) });
        SM.label(ctx, BRAND, W / 2, 1640, { size: 16, color: "rgba(255,255,255,0.2)", spacing: 0.5 });
        FX.leak(ctx, t, 0.1 + tw(t, SUM, SUM + 0.4) * 0.2 * (1 - tw(t, SUM + 1.5, SUM + 2.5)));
        SM.vignette(ctx, 0.65);
        SM.grain(ctx, t, 0.05);
      }

      document.fonts.load('800 40px "Jakarta"').then(() => {
        try { const v = window.__hyperframes.getVariables(); if (v && v.brand) BRAND = v.brand; } catch (e) {}
        tl.fromTo("#hook-l1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
        tl.fromTo("#hook-l2", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.7);
        tl.fromTo("#hook p", { opacity: 1, y: 0 }, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.4, ease: "power3.in", stagger: 0.06 }, 2.45);
        tl.fromTo("#quote .q", { opacity: 0, filter: "blur(12px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.55, ease: "power4.out", stagger: 0.3 }, 18.5);
        tl.fromTo("#quote .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 19.6);
        SM.mount("stage", DUR, draw, tl);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
