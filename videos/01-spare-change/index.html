<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"hook1","type":"string","label":"Hook line 1","default":"$5 a day."},
    {"id":"hook2","type":"string","label":"Hook line 2","default":"Seems like nothing, right?"},
    {"id":"quote1","type":"string","label":"Quote line 1","default":"Spare change today."},
    {"id":"quote2a","type":"string","label":"Quote line 2 (before keyword)","default":"Starting"},
    {"id":"quote2b","type":"string","label":"Quote keyword","default":"capital"},
    {"id":"quote2c","type":"string","label":"Quote line 2 (after keyword)","default":"tomorrow."},
    {"id":"brand","type":"string","label":"Watermark","default":"BUSINESS STICKMAN"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/stickman.js"></script>
    <style>
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root { --ink: #eef1f6; --accent: #ffc23d; --muted: #8b93a3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0c11; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Jakarta", sans-serif; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .lines { position: absolute; left: 90px; right: 90px; top: 240px; text-align: center; color: var(--ink); font-weight: 800; letter-spacing: -0.02em; }
      .lines p { font-size: 66px; line-height: 1.18; }
      .w { display: inline-block; white-space: pre; }
      .key { color: var(--accent); text-shadow: 0 0 28px rgba(255, 194, 61, 0.55); }
      .soft { color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" data-start="0" data-duration="18" data-track-index="0"></canvas>

      <div id="hook" class="lines clip" data-start="0" data-duration="3.2" data-track-index="1">
        <p id="hook-l1"><span class="w" data-var-text="hook1">$5 a day.</span></p>
        <p id="hook-l2" class="soft"><span class="w" data-var-text="hook2">Seems like nothing, right?</span></p>
      </div>

      <div id="quote" class="lines clip" data-start="14.4" data-duration="3.6" data-track-index="2">
        <p><span class="w q" data-var-text="quote1">Spare change today.</span></p>
        <p><span class="w q" data-var-text="quote2a">Starting</span> <span class="w q key" data-var-text="quote2b">capital</span> <span class="w q" data-var-text="quote2c">tomorrow.</span></p>
      </div>

      <!-- sound: every hit has a cause on screen -->
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="2.95" data-duration="10.03" data-track-index="5" data-volume="0.22"></audio>
      <audio id="sfx-pill" class="clip" src="assets/sfx/pop.mp3" data-start="2.42" data-duration="0.72" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-c1" class="clip" src="assets/sfx/pop.mp3" data-start="3.43" data-duration="0.72" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-c2" class="clip" src="assets/sfx/click-soft.mp3" data-start="5.03" data-duration="0.37" data-track-index="8" data-volume="0.45"></audio>
      <audio id="sfx-c3" class="clip" src="assets/sfx/pop.mp3" data-start="6.43" data-duration="0.72" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-c4" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.63" data-duration="0.37" data-track-index="8" data-volume="0.45"></audio>
      <audio id="sfx-c5" class="clip" src="assets/sfx/pop.mp3" data-start="8.63" data-duration="0.72" data-track-index="7" data-volume="0.28"></audio>
      <audio id="sfx-c6" class="clip" src="assets/sfx/click-soft.mp3" data-start="9.43" data-duration="0.37" data-track-index="8" data-volume="0.4"></audio>
      <audio id="sfx-c7" class="clip" src="assets/sfx/pop.mp3" data-start="10.13" data-duration="0.72" data-track-index="7" data-volume="0.26"></audio>
      <audio id="sfx-c8" class="clip" src="assets/sfx/click-soft.mp3" data-start="10.73" data-duration="0.37" data-track-index="8" data-volume="0.4"></audio>
      <audio id="sfx-c9" class="clip" src="assets/sfx/pop.mp3" data-start="11.23" data-duration="0.72" data-track-index="7" data-volume="0.26"></audio>
      <audio id="sfx-bills" class="clip" src="assets/sfx/notification.mp3" data-start="12.05" data-duration="2.46" data-track-index="9" data-volume="0.3"></audio>
      <audio id="sfx-shine" class="clip" src="assets/sfx/sparkle.mp3" data-start="12.1" data-duration="1.8" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="12.98" data-duration="2.12" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-buy" class="clip" src="assets/sfx/chime.mp3" data-start="14.15" data-duration="2.5" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-quote" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="14.42" data-duration="0.6" data-track-index="13" data-volume="0.3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 18;
      const { W, H, C, E, clamp, lerp, tw, kf, rng } = SM;

      // ---- story timing ----
      const DAY0 = 2.6, DAY1 = 12.0;               // day counter runs 1 -> 365
      const BEATS = [3.0, 4.6, 6.0, 7.2, 8.2, 9.0, 9.7, 10.3, 10.8, 11.3, 11.7];
      const ITEMS = ["coffee", "shoe", "game", "bag", "coffee"];
      const BOOM = 12.6;                           // jar becomes a cart
      const GA = 880, GB = 1310;                   // ground lines of the two panels
      const dayAt = (t) => Math.round(1 + 364 * Math.pow(clamp((t - DAY0) / (DAY1 - DAY0)), 1.9));
      const money = (n) => "$" + n.toLocaleString("en-US");
      const brand = () => (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables().brand) || "BUSINESS STICKMAN";
      let BRAND = "BUSINESS STICKMAN";

      function beatK(t, i, len = 0.45) { return clamp((t - BEATS[i]) / len); }
      function lastBeat(t) { let b = -1; BEATS.forEach((bt, i) => { if (t >= bt) b = i; }); return b; }

      function panelBg(ctx, y0, y1, t, warm) {
        ctx.save();
        ctx.beginPath(); ctx.rect(0, y0, W, y1 - y0); ctx.clip();
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, SM.mixColor("#161a23", warm > 0 ? "#2a2218" : "#151a22", Math.abs(warm)));
        g.addColorStop(1, "#0e1016");
        ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0);
        SM.city(ctx, y1 - 70, t * 6, 1, warm >= 0 ? 7 : 21, 0.18 + Math.max(0, warm) * 0.25, "#1a1f29");
        ctx.restore();
      }

      function draw(ctx, t) {
        SM.background(ctx);
        const push = kf(t, [[0, 1.13], [12.4, 1.17], [13.0, 1.2], [18, 1.23]], E.inOut);
        ctx.save();
        SM.camera(ctx, { x: W / 2, y: 930, z: push, sx: W / 2, sy: 1010 });

        const warmB = tw(t, 9, 13.2);
        const coldA = tw(t, 7, 12.5);

        // ---------- panel A: SPEND FIRST ----------
        panelBg(ctx, 500, GA + 60, t, -coldA);
        SM.groundStrip(ctx, GA, 60);
        SM.label(ctx, "SPEND FIRST", 300, 560, { size: 24, color: SM.mixColor("#8a93a3", C.coral, coldA * 0.6) });

        const slump = tw(t, 8.0, 12.8);
        const ax = 330;
        let pA = SM.poseMix(SM.POSE.phone, SM.POSE.slump, slump * 0.85);
        pA = { ...pA, head: pA.head + Math.sin(t * 1.7) * 0.03 };
        const jA = SM.stickman(ctx, { x: ax, y: GA, s: 1, pose: pA, color: SM.mixColor(C.hero, "#b9c0cc", coldA) });
        // phone glow in hands
        const hp = [(jA.handF[0] + jA.handB[0]) / 2, (jA.handF[1] + jA.handB[1]) / 2 - 6];
        SM.phone(ctx, hp[0] + 6, hp[1], 0.95, 0.6 + 0.4 * Math.sin(t * 6) * 0.2 - slump * 0.3);

        // A's purchases: bubbles with items for the first beats
        const lb = lastBeat(t);
        for (let i = 0; i < ITEMS.length; i++) {
          const k0 = beatK(t, i, 0.35), k1 = clamp((t - (BEATS[i + 1] || 99) + 0.05) / 0.2);
          if (k0 <= 0 || k1 >= 1) continue;
          const b = SM.thought(ctx, 620, 690, 170, 140, k0 * (1 - k1), [jA.head[0] + 20, jA.head[1] - 20]);
          if (b && b.sc > 0.2) SM.icon(ctx, ITEMS[i], 620, 690, 0.9 * b.sc);
          // price tag flies off
          const pk = clamp((t - BEATS[i] - 0.2) / 0.9);
          if (pk > 0 && pk < 1) SM.text(ctx, "-$5", 740, 640 - pk * 60, { size: 34, color: C.coral, alpha: 1 - pk });
        }
        // bills stack from beat 5 on
        let nBills = 0;
        for (let i = 4; i < BEATS.length; i++) {
          const k = clamp((t - BEATS[i]) / 0.4);
          if (k <= 0) continue;
          const r = rng(i * 5 + 1);
          const yy = lerp(520, GA - 50 - nBills * 30, E.out(k));
          SM.bill(ctx, 640 + (r() - 0.5) * 60, yy, 0.95, (r() - 0.5) * 0.35 * (1 - k * 0.5));
          nBills++;
        }
        // A's saved counter
        const sA = clamp((t - 2.6) / 0.5);
        SM.label(ctx, "SAVED", 860, 660, { size: 18, alpha: sA });
        const shake = t > 12 && t < 12.6 ? Math.sin(t * 90) * 5 : 0;
        SM.text(ctx, "$0", 860 + shake, 705, { size: 52, color: SM.mixColor(C.text, C.coral, coldA), alpha: sA });
        if (t > 12.0) SM.label(ctx, "BILLS DUE", 640, GA - 50 - nBills * 30 - 60, { size: 20, color: C.coral, alpha: tw(t, 12.0, 12.4) });

        // rain falls on the spender as the bills pile up
        ctx.save(); ctx.beginPath(); ctx.rect(-100, 500, W + 200, GA - 500); ctx.clip();
        SM.rain(ctx, t, tw(t, 6.5, 12.0) * 0.9, 5, 0.12);
        ctx.restore();

        // ---------- divider ----------
        ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(80, 938, W - 160, 2);

        // ---------- panel B: SAVE FIRST ----------
        panelBg(ctx, 940, GB + 60, t, warmB);
        SM.groundStrip(ctx, GB, 400, "");
        SM.motes(ctx, t, Math.round(10 + warmB * 30), 11, "#ffd27a", 0.25 + warmB * 0.5);
        SM.label(ctx, "SAVE FIRST", 300, 1000, { size: 24, color: SM.mixColor("#8a93a3", C.amber, warmB * 0.8) });

        const bx = 330, jx = 580;
        const boom = tw(t, BOOM, BOOM + 0.5, E.out);
        // throw motion on each beat
        let pB = SM.POSE.stand;
        for (let i = 0; i < BEATS.length; i++) {
          const k = clamp((t - BEATS[i] + 0.25) / 0.55);
          if (k > 0 && k < 1) { const a = Math.sin(k * Math.PI); pB = SM.poseMix(SM.POSE.stand, SM.POSE.give, a); }
        }
        if (t > BOOM) pB = SM.poseMix(pB, SM.POSE.proud, tw(t, BOOM, BOOM + 0.4));
        if (t > 13.8) pB = SM.poseMix(SM.POSE.proud, SM.POSE.give, Math.sin(clamp((t - 13.8) / 0.8) * Math.PI));
        pB = { ...pB, head: pB.head + Math.sin(t * 2) * 0.02 };

        // jar (fades out into cart)
        const day = dayAt(t);
        const fill = clamp((day - 1) / 364);
        const jarGlow = tw(t, 11.6, 12.3) * (1 - boom);
        if (boom < 1) {
          ctx.save(); ctx.globalAlpha = 1 - boom;
          const js = 1 + tw(t, 12.0, BOOM, E.in) * 0.25;
          SM.jar(ctx, jx, GB, js, fill, t, jarGlow);
          ctx.restore();
        }
        // seller steps behind his new cart
        const toCart = tw(t, BOOM + 0.2, BOOM + 1.0, E.inOut);
        const bxNow = lerp(bx, jx + 30, toCart);
        if (toCart > 0 && toCart < 1) pB = SM.walk(t * 10, 0.8);
        const jB = SM.stickman(ctx, { x: bxNow, y: GB - 10 * toCart, s: 1, pose: pB, color: C.hero, glowA: warmB * 0.25 });
        // cart appears
        if (t > BOOM - 0.05) {
          const ck = tw(t, BOOM, BOOM + 0.7, E.back);
          ctx.save(); ctx.translate(jx + 60, GB); ctx.scale(ck, ck); ctx.translate(-(jx + 60), -GB);
          SM.cart(ctx, jx + 60, GB, 1.05, { awning: tw(t, BOOM + 0.3, BOOM + 0.9), sign: "ICED TEA", light: tw(t, BOOM + 0.5, BOOM + 1.1), t });
          ctx.restore();
        }
        // flash burst at transformation
        if (t > BOOM - 0.1 && t < BOOM + 0.8) {
          const fk = clamp((t - BOOM + 0.1) / 0.9);
          SM.glow(ctx, jx, GB - 120, 200 + fk * 500, C.amber, (1 - fk) * 1.4);
        }

        // coins: from hand to jar on each beat
        for (let i = 0; i < BEATS.length; i++) {
          const k = clamp((t - BEATS[i]) / 0.45);
          if (k <= 0 || k >= 1) continue;
          const sx = bx + 95, sy = GB - 200, ex = jx, ey = GB - 165;
          const x = lerp(sx, ex, k), y = lerp(sy, ey, k) - Math.sin(k * Math.PI) * 110;
          SM.coin(ctx, x, y, 16, k * 10);
        }
        // B's saved counter
        const savedB = (t > BOOM ? 365 : day) * 5;
        const sB = clamp((t - 2.6) / 0.5) * (1 - tw(t, BOOM - 0.1, BOOM + 0.3));
        SM.label(ctx, "SAVED", 860, 1100, { size: 18, alpha: sB });
        SM.text(ctx, money(t < DAY0 ? 0 : savedB), 860, 1145, { size: 52, color: SM.mixColor(C.text, C.amber, warmB), alpha: sB });
        // first customer at the cart
        if (t > 13.3) {
          const wk = tw(t, 13.3, 14.0, E.out);
          const cx = lerp(1150, 900, wk);
          const pc = wk < 1 ? SM.walk(t * 9, 1 - wk * 0.6) : SM.POSE.give;
          SM.stickman(ctx, { x: cx, y: GB, s: 0.92, face: -1, pose: t > 13.95 ? SM.poseMix(SM.POSE.stand, SM.POSE.give, Math.sin(clamp((t - 13.95) / 0.7) * Math.PI)) : pc, color: C.other });
          if (t > 14.1) SM.coin(ctx, 800, GB - 240 - tw(t, 14.1, 14.8, E.out) * 50, 14, t * 6, 1 - tw(t, 14.5, 14.9));
        }
        ctx.restore();

        // ---------- HUD (not affected by camera) ----------
        const pillIn = tw(t, 2.3, 2.6, E.back), pillOut = 1 - tw(t, 14.2, 14.5);
        const pulse = t > 12 && t < 12.6 ? 1 + Math.sin((t - 12) / 0.6 * Math.PI) * 0.18 : 1;
        SM.pill(ctx, "DAY " + dayAt(t), W / 2, 450, {
          size: 34, alpha: pillIn * pillOut, scale: pillIn * pulse,
          bg: t >= 12 ? C.amber : "#262b36", fg: t >= 12 ? "#2a1c00" : C.hero,
        });
        SM.label(ctx, BRAND, W / 2, 1600, { size: 16, color: "rgba(255,255,255,0.18)", spacing: 0.5 });
        SM.vignette(ctx, 0.7);
        SM.grain(ctx, t, 0.06);
      }

      document.fonts.load('800 40px "Jakarta"').then(() => {
        try { BRAND = brand(); } catch (e) {}
        // text: hook is already on screen at frame 0 (thumbnail), then lifts away
        tl.fromTo("#hook-l1", { opacity: 1, y: 0 }, { opacity: 1, y: 0, duration: 0.01 }, 0);
        tl.fromTo("#hook-l2", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0.55);
        tl.fromTo("#hook p", { opacity: 1 }, { opacity: 0, y: -30, filter: "blur(6px)", duration: 0.5, ease: "power2.in", stagger: 0.06 }, 2.55);
        // quote word by word
        tl.fromTo("#quote .q", { opacity: 0, y: 28, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.32 }, 14.5);
        tl.fromTo("#quote .key", { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 15.6);
        SM.mount("stage", DUR, draw, tl);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
