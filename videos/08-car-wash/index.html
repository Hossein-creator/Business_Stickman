<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"hook1","type":"string","label":"Hook line 1","default":"Got $50?"},
    {"id":"hook2","type":"string","label":"Hook line 2","default":"Start this business this weekend."},
    {"id":"quote1","type":"string","label":"Quote line 1","default":"You don’t need a lot of money."},
    {"id":"quote2a","type":"string","label":"Quote line 2 (before keyword)","default":"You need a"},
    {"id":"quote2b","type":"string","label":"Quote keyword","default":"first customer."},
    {"id":"brand","type":"string","label":"Watermark","default":"BUSINESS STICKMAN"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/stickman.js"></script>
    <script src="assets/lib/stickman-props.js"></script>
    <script src="assets/lib/stickman-fx.js"></script>
    <script src="assets/lib/stickman-ui.js"></script>
    <style>
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root { --ink: #eef1f6; --accent: #ffc23d; --muted: #9aa3b3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0c11; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Jakarta", sans-serif; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .lines { position: absolute; left: 60px; right: 60px; top: 250px; text-align: center; color: var(--ink); font-weight: 800; letter-spacing: -0.02em; }
      .lines p { font-size: 62px; line-height: 1.18; }
      .lines p.huge { font-size: 120px; }
      .w { display: inline-block; white-space: pre; }
      .key { position: relative; color: var(--accent); text-shadow: 0 0 30px rgba(255, 194, 61, 0.6); }
      .bar { position: absolute; left: 0; right: 0; bottom: -4px; height: 8px; border-radius: 4px; background: var(--accent); transform-origin: left center; }
      .soft { color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-motion-blur="on" data-motion-blur-events="on" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" data-start="0" data-duration="22" data-track-index="0"></canvas>

      <div id="hook" class="lines clip" data-start="0" data-duration="2.9" data-track-index="1">
        <p id="hook-l1" class="huge key"><span class="w" data-var-text="hook1">Got $50?</span></p>
        <p id="hook-l2"><span class="w" data-var-text="hook2">Start this business this weekend.</span></p>
      </div>

      <div id="quote" class="lines clip" data-start="18.5" data-duration="3.5" data-track-index="2">
        <p><span class="w q" data-var-text="quote1">You don’t need a lot of money.</span></p>
        <p><span class="w q" data-var-text="quote2a">You need a</span> <span class="w q key"><span data-var-text="quote2b">first customer.</span><span class="bar"></span></span></p>
      </div>

      <audio id="sfx-i1" class="clip" src="assets/sfx/pop.mp3" data-start="3.32" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-i2" class="clip" src="assets/sfx/click-soft.mp3" data-start="3.77" data-duration="0.37" data-track-index="6" data-volume="0.45"></audio>
      <audio id="sfx-i3" class="clip" src="assets/sfx/pop.mp3" data-start="4.22" data-duration="0.72" data-track-index="5" data-volume="0.28"></audio>
      <audio id="sfx-i4" class="clip" src="assets/sfx/click-soft.mp3" data-start="4.67" data-duration="0.37" data-track-index="6" data-volume="0.45"></audio>
      <audio id="sfx-i5" class="clip" src="assets/sfx/pop.mp3" data-start="5.12" data-duration="0.72" data-track-index="5" data-volume="0.28"></audio>
      <audio id="sfx-total" class="clip" src="assets/sfx/ping.mp3" data-start="5.75" data-duration="1.32" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-s2" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.0" data-duration="0.6" data-track-index="8" data-volume="0.3"></audio>
      <audio id="sfx-shine" class="clip" src="assets/sfx/sparkle.mp3" data-start="10.75" data-duration="1.8" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-paid" class="clip" src="assets/sfx/chime.mp3" data-start="11.3" data-duration="2.5" data-track-index="10" data-volume="0.3"></audio>
      <audio id="sfx-s3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="12.3" data-duration="0.6" data-track-index="8" data-volume="0.28"></audio>
      <audio id="sfx-c1" class="clip" src="assets/sfx/pop.mp3" data-start="12.92" data-duration="0.72" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-c2" class="clip" src="assets/sfx/pop.mp3" data-start="13.32" data-duration="0.72" data-track-index="12" data-volume="0.25"></audio>
      <audio id="sfx-c3" class="clip" src="assets/sfx/pop.mp3" data-start="13.72" data-duration="0.72" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-c4" class="clip" src="assets/sfx/pop.mp3" data-start="14.12" data-duration="0.72" data-track-index="12" data-volume="0.25"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="6.6" data-duration="10.03" data-track-index="13" data-volume="0.16"></audio>
      <audio id="sfx-month" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="16.62" data-duration="2.12" data-track-index="14" data-volume="0.45"></audio>
      <audio id="sfx-quote" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="18.55" data-duration="0.6" data-track-index="15" data-volume="0.28"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 22;
      const { W, H, C, E, clamp, lerp, tw, kf, rng } = SM;
      const FX = SM.fx, UI = SM.ui;
      let BRAND = "BUSINESS STICKMAN";

      const KIT = [["bucket", "Bucket", 8], ["soap", "Car soap", 10], ["sponge", "Sponges", 7], ["cloth", "Microfiber", 15], ["spray", "Spray", 10]];
      const S1 = 2.9, S2 = 7.0, S3 = 12.3, S4 = 15.2, Q = 18.5;
      const GY = 1240;

      // side view of a small car; dirt 0..1
      function car(ctx, x, y, s, dirt, shine = 0) {
        ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
        const body = SM.mixColor("#4f86c9", "#7d6b55", dirt * 0.85);
        // cabin
        ctx.beginPath(); ctx.moveTo(-150, -120); ctx.lineTo(-90, -200); ctx.lineTo(110, -200); ctx.lineTo(180, -120); ctx.closePath();
        ctx.lineWidth = 8; ctx.strokeStyle = C.out; ctx.stroke(); ctx.fillStyle = body; ctx.fill();
        // windows
        ctx.beginPath(); ctx.moveTo(-120, -128); ctx.lineTo(-78, -186); ctx.lineTo(10, -186); ctx.lineTo(10, -128); ctx.closePath(); ctx.fillStyle = SM.mixColor("#bfe3ff", "#8a8270", dirt); ctx.fill();
        ctx.beginPath(); ctx.moveTo(26, -128); ctx.lineTo(26, -186); ctx.lineTo(100, -186); ctx.lineTo(150, -128); ctx.closePath(); ctx.fill();
        // body
        SM.box(ctx, -260, -130, 520, 110, 40, body, 8);
        SM.box(ctx, 218, -100, 34, 22, 8, "#ffe29a", 0);
        SM.box(ctx, -256, -98, 24, 20, 6, "#ef6f5e", 0);
        ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fillRect(-250, -60, 500, 10);
        // wheels
        for (const wx of [-150, 150]) { SM.circle(ctx, wx, -20, 52, "#1d2230", 8); SM.circle(ctx, wx, -20, 22, "#9aa3b3", 5); }
        // mud
        if (dirt > 0) {
          const r = rng(31);
          for (let i = 0; i < 22; i++) { ctx.fillStyle = `rgba(92,66,40,${0.75 * dirt})`; ctx.beginPath(); ctx.ellipse(-240 + r() * 480, -170 + r() * 150, 14 + r() * 26, 8 + r() * 14, r() * 3, 0, Math.PI * 2); ctx.fill(); }
        }
        // clean shine highlight
        if (shine > 0) { ctx.strokeStyle = `rgba(255,255,255,${0.55 * shine})`; ctx.lineWidth = 8; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-220, -112); ctx.lineTo(200, -112); ctx.stroke(); }
        ctx.restore();
      }

      function draw(ctx, t) {
        // dusk driveway
        const sk = ctx.createLinearGradient(0, 0, 0, H);
        sk.addColorStop(0, "#151a26"); sk.addColorStop(0.6, "#1e2232"); sk.addColorStop(1, "#0a0c11");
        ctx.fillStyle = sk; ctx.fillRect(0, 0, W, H);
        SM.city(ctx, GY - 40, t * 5, 1, 19, 0.15, "#191d28");
        SM.groundStrip(ctx, GY, 700);
        const hh = FX.handheld(t, 0.7);
        ctx.save(); ctx.translate(hh.dx, hh.dy);

        // ---- frame 0: a dirty car and a $50 bill ----
        const intro = 1 - tw(t, 2.5, 3.0, E.in);
        if (intro > 0) {
          ctx.save(); ctx.globalAlpha *= intro;
          car(ctx, 690, GY - 40, 1.1, 1);
          const ji = SM.stickman(ctx, { x: 170, y: GY, pose: { ...SM.POSE.give, head: -0.1 + Math.sin(t * 2) * 0.04 }, color: C.hero });
          ctx.save(); ctx.translate(ji.handF[0] + 46, ji.handF[1] - 20 + Math.sin(t * 3) * 6); ctx.rotate(-0.12 + Math.sin(t * 2) * 0.05);
          SM.glow(ctx, 0, 0, 160, C.amber, 0.5);
          SM.box(ctx, -66, -34, 132, 68, 8, "#8fcf86", 5); SM.box(ctx, -56, -24, 112, 48, 6, "#a6dc98", 0);
          SM.text(ctx, "$50", 0, 2, { size: 34, color: "#2f5a2a" });
          ctx.restore();
          ctx.restore();
        }

        // ---- STEP 1: buy the kit ----
        const s1out = tw(t, S2 - 0.3, S2 + 0.3, E.in);
        UI.step(ctx, 1, "Buy the kit", W / 2, 360, tw(t, S1, S1 + 0.4, E.lin) * (1 - tw(t, S2 - 0.3, S2)));
        let total = 0;
        KIT.forEach(([ic, name, price], i) => {
          const t0 = S1 + 0.4 + i * 0.45;
          const k = tw(t, t0, t0 + 0.5, E.back);
          if (k <= 0) return;
          total += price * clamp((t - t0) / 0.3);
          const col = i % 3, rowI = Math.floor(i / 3);
          const n = rowI === 0 ? 3 : 2;
          let x = W / 2 + (col - (n - 1) / 2) * 300, y = 600 + rowI * 280;
          // cards fly to the hand at step 2
          x = lerp(x, 330, s1out); y = lerp(y, GY - 160, s1out);
          const sc = k * lerp(1, 0.2, s1out);
          ctx.save(); ctx.globalAlpha *= 1 - tw(t, S2 + 0.1, S2 + 0.35); ctx.translate(x, y); ctx.scale(sc, sc);
          SM.rr(ctx, -125, -115, 250, 230, 30); ctx.fillStyle = "#1d222d"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.stroke();
          UI.ico(ctx, ic, 0, -30, 2.1);
          SM.text(ctx, name, 0, 50, { size: 26, color: C.text });
          SM.text(ctx, "$" + price, 0, 88, { size: 32, color: C.amber });
          ctx.restore();
        });
        const totA = tw(t, S1 + 0.4, S1 + 0.8) * (1 - s1out);
        const done = t > 5.75;
        const tp = done && t < 6.3 ? 1 + Math.sin((t - 5.75) / 0.55 * Math.PI) * 0.15 : 1;
        UI.bigNumber(ctx, "$" + Math.round(Math.min(50, total)), done ? "TOTAL · DONE ✓" : "TOTAL", W / 2, 1180, totA, { size: 100 * tp, color: done ? C.amber : C.hero, glowA: done ? 0.5 : 0 });

        // ---- STEP 2: wash ----
        const s2 = tw(t, S2, S2 + 0.5, E.outQuint) * (1 - tw(t, S3 - 0.2, S3 + 0.2));
        UI.step(ctx, 2, "Wash a car", W / 2, 360, tw(t, S2 + 0.1, S2 + 0.5, E.lin) * (1 - tw(t, S3 - 0.3, S3)));
        if (s2 > 0) {
          ctx.save(); ctx.globalAlpha *= s2;
          const cx = 600, cy = GY - 30;
          const sweep = tw(t, 8.2, 10.6, E.inOut);
          const sx = cx - 330 + sweep * 660;
          // dirty half and clean half
          ctx.save(); ctx.beginPath(); ctx.rect(sx, 0, W, H); ctx.clip(); car(ctx, cx, cy, 1.2, 1); ctx.restore();
          ctx.save(); ctx.beginPath(); ctx.rect(0, 0, sx, H); ctx.clip(); car(ctx, cx, cy, 1.2, 0, tw(t, 10.4, 10.9)); ctx.restore();
          // foam at the sweep edge
          if (sweep > 0 && sweep < 1) for (let i = 0; i < 16; i++) { const q = rng(i * 3 + Math.floor(t * 14)); SM.circle(ctx, sx + (q() - 0.5) * 40, cy - 40 - q() * 170, 6 + q() * 12, "rgba(255,255,255,0.85)", 0); }
          UI.glint(ctx, cx - 312, cy - 240, 624, 216, tw(t, 10.6, 11.3, E.inOut));
          // washer follows the sweep
          const wx = Math.min(sx - 40, cx + 250), wipe = Math.sin(t * 9) * 0.35;
          const pose = { ...SM.POSE.wipe, aF: [SM.POSE.wipe.aF[0] + wipe, SM.POSE.wipe.aF[1] + wipe] };
          const jw = SM.stickman(ctx, { x: lerp(330, wx, tw(t, 7.6, 8.3)), y: GY, pose: t > 10.8 ? SM.POSE.proud : pose, color: C.hero });
          if (t < 10.8) UI.ico(ctx, "sponge", jw.handF[0], jw.handF[1], 0.8);
          // sparkles on the clean car
          const sp = tw(t, 10.7, 11.0) * (1 - tw(t, 11.8, 12.2));
          for (let i = 0; i < 6; i++) { const q = rng(i + 50), px = cx - 220 + q() * 440, py = cy - 60 - q() * 140, s = (0.5 + 0.5 * Math.sin(t * 8 + i)) * sp; ctx.save(); ctx.translate(px, py); ctx.rotate(Math.PI / 4); ctx.fillStyle = "#fff"; ctx.fillRect(-2, -14 * s, 4, 28 * s); ctx.fillRect(-14 * s, -2, 28 * s, 4); ctx.restore(); }
          SM.pill(ctx, "+$10 PER CAR", cx, cy - 340, { size: 34, bg: C.amber, fg: "#2a1c00", scale: Math.max(0.001, tw(t, 11.2, 11.6, E.back)), alpha: tw(t, 11.2, 11.4) });
          ctx.restore();
        }

        // ---- STEP 3: repeat ----
        const s3 = tw(t, S3, S3 + 0.5, E.outQuint) * (1 - tw(t, S4 - 0.2, S4 + 0.2));
        UI.step(ctx, 3, "Repeat", W / 2, 360, tw(t, S3 + 0.1, S3 + 0.5, E.lin) * (1 - tw(t, S4 - 0.3, S4)));
        if (s3 > 0) {
          ctx.save(); ctx.globalAlpha *= s3;
          let cars = 0;
          for (let i = 0; i < 6; i++) {
            const t0 = S3 + 0.5 + i * 0.4, k = tw(t, t0, t0 + 0.45, E.outQuint);
            if (k <= 0) continue;
            cars++;
            const col = i % 3, rowI = Math.floor(i / 3);
            car(ctx, lerp(W + 300, 210 + col * 330, k), 760 + rowI * 260, 0.55, 0, 0.6);
          }
          UI.bigNumber(ctx, "$" + cars * 10, cars + " CARS TODAY", W / 2, 1180, 1, { size: 96, color: C.hero, glowA: 0 });
          const fee = tw(t, 15.0 - 0.6, 15.0 - 0.3);
          SM.text(ctx, "− $5 soap refill = $55 a day", W / 2, 1300, { size: 30, color: C.text, alpha: fee });
          ctx.restore();
        }

        // ---- payoff: weekends only ----
        const s4 = tw(t, S4, S4 + 0.5, E.outQuint);
        if (s4 > 0) {
          ctx.save(); ctx.globalAlpha *= s4;
          const qShift = tw(t, Q - 0.2, Q + 0.4, E.inOut);
          ctx.translate(0, qShift * 110);
          SM.label(ctx, "ONLY ON WEEKENDS", W / 2, 470, { size: 26, color: C.text });
          const cw = 112, x0 = W / 2 - 3 * cw, y0 = 560;
          ["M", "T", "W", "T", "F", "S", "S"].forEach((d, i) => SM.text(ctx, d, x0 + i * cw, y0, { size: 26, color: i >= 5 ? C.amber : C.label }));
          let lit = 0;
          for (let w = 0; w < 4; w++) for (let d = 0; d < 7; d++) {
            const x = x0 + d * cw, y = y0 + 70 + w * 100;
            const wk = d >= 5, idx = w * 2 + (d - 5);
            const on = wk && t > S4 + 0.5 + idx * 0.18;
            if (on) lit++;
            SM.rr(ctx, x - 46, y - 40, 92, 80, 18);
            ctx.fillStyle = on ? C.amber : "rgba(255,255,255,0.05)"; ctx.fill();
            if (on) { ctx.fillStyle = "#2a1c00"; ctx.font = `800 24px ${SM.FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("$55", x, y + 1); }
          }
          const month = lit * 55;
          const big = tw(t, 16.6, 17.0, E.back);
          UI.bigNumber(ctx, "$" + month + " / month", big > 0 ? "FROM A $50 START" : "8 WEEKEND DAYS × $55", W / 2, 1110, 1, { size: 92 * (big > 0 ? lerp(1, 1.08, Math.sin(clamp((t - 16.6) / 0.5) * Math.PI)) : 1), color: big > 0 ? C.amber : C.hero, glowA: big * 0.6 });
          ctx.restore();
        }
        ctx.restore();

        FX.confetti(ctx, t, 16.6, { life: 3.2 });
        FX.moneyRain(ctx, t, 16.7, { life: 2.8, n: 18 });
        FX.leak(ctx, t, 0.12 + tw(t, 16.6, 17.0) * 0.25 * (1 - tw(t, 18, 19)));

        // chrome
        UI.topic(ctx, "BUSINESS IDEA: CAR WASH", 196, tw(t, 2.9, 3.3));
        SM.label(ctx, "EXAMPLE PRICES · CHECK LOCAL PRICES AND RULES", W / 2, 1360, { size: 15, color: "rgba(255,255,255,0.45)", spacing: 0.12, alpha: tw(t, 3.2, 3.6) * (1 - tw(t, Q - 0.3, Q)) });
        SM.label(ctx, BRAND, W / 2, 1640, { size: 16, color: "rgba(255,255,255,0.2)", spacing: 0.5 });
        SM.vignette(ctx, 0.65);
        SM.grain(ctx, t, 0.05);
      }

      // frame 0: the money and the kit tease behind the hook
      document.fonts.load('800 40px "Jakarta"').then(() => {
        try { const v = window.__hyperframes.getVariables(); if (v && v.brand) BRAND = v.brand; } catch (e) {}
        tl.fromTo("#hook-l1", { opacity: 1, scale: 1 }, { opacity: 1, scale: 1, duration: 0.01 }, 0);
        tl.fromTo("#hook-l2", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.6);
        tl.fromTo("#hook p", { opacity: 1, y: 0 }, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.4, ease: "power3.in", stagger: 0.06 }, 2.45);
        tl.fromTo("#quote .q", { opacity: 0, filter: "blur(12px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.55, ease: "power4.out", stagger: 0.3 }, 18.6);
        tl.fromTo("#quote .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 19.6);
        SM.mount("stage", DUR, draw, tl);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
