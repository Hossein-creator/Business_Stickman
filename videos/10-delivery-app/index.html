<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"hook1","type":"string","label":"Hook line 1","default":"You pay $12.50 for this order."},
    {"id":"hook2","type":"string","label":"Hook line 2","default":"Who really gets your money?"},
    {"id":"quote1","type":"string","label":"Quote line 1","default":"The one who connects"},
    {"id":"quote2","type":"string","label":"Quote keyword","default":"collects."},
    {"id":"brand","type":"string","label":"Watermark","default":"BUSINESS STICKMAN"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/stickman.js"></script>
    <script src="assets/lib/stickman-props.js"></script>
    <script src="assets/lib/stickman-fx.js"></script>
    <script src="assets/lib/stickman-ui.js"></script>
    <style>
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      :root { --ink: #eef1f6; --accent: #ffc23d; --muted: #9aa3b3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0c11; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Jakarta", sans-serif; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .lines { position: absolute; left: 60px; right: 60px; top: 250px; text-align: center; color: var(--ink); font-weight: 800; letter-spacing: -0.02em; }
      .lines p { font-size: 66px; line-height: 1.16; }
      .lines p.big { font-size: 96px; }
      .w { display: inline-block; white-space: pre; }
      .key { position: relative; color: var(--accent); text-shadow: 0 0 30px rgba(255, 194, 61, 0.6); }
      .bar { position: absolute; left: 0; right: 0; bottom: -4px; height: 8px; border-radius: 4px; background: var(--accent); transform-origin: left center; }
      .soft { color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-motion-blur="on" data-motion-blur-events="on" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" data-start="0" data-duration="22" data-track-index="0"></canvas>

      <div id="hook" class="lines clip" data-start="0" data-duration="3.0" data-track-index="1">
        <p id="hook-l1"><span class="w" data-var-text="hook1">You pay $12.50 for this order.</span></p>
        <p id="hook-l2" class="soft"><span class="w" data-var-text="hook2">Who really gets your money?</span></p>
      </div>

      <div id="quote" class="lines clip" data-start="18.4" data-duration="3.6" data-track-index="2">
        <p><span class="w q" data-var-text="quote1">The one who connects</span></p>
        <p class="big"><span class="w q key"><span data-var-text="quote2">collects.</span><span class="bar"></span></span></p>
      </div>

      <audio id="sfx-hand" class="clip" src="assets/sfx/click-soft.mp3" data-start="1.1" data-duration="0.37" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-zoom" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="2.4" data-duration="1.4" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sfx-r1" class="clip" src="assets/sfx/pop.mp3" data-start="3.6" data-duration="0.72" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-r2" class="clip" src="assets/sfx/click-soft.mp3" data-start="4.4" data-duration="0.37" data-track-index="8" data-volume="0.45"></audio>
      <audio id="sfx-r3" class="clip" src="assets/sfx/pop.mp3" data-start="5.2" data-duration="0.72" data-track-index="7" data-volume="0.28"></audio>
      <audio id="sfx-total" class="clip" src="assets/sfx/ping.mp3" data-start="6.0" data-duration="1.32" data-track-index="9" data-volume="0.3"></audio>
      <audio id="sfx-bar" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.7" data-duration="0.6" data-track-index="10" data-volume="0.3"></audio>
      <audio id="sfx-f1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.5" data-duration="0.6" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-a1" class="clip" src="assets/sfx/ping.mp3" data-start="9.0" data-duration="1.32" data-track-index="12" data-volume="0.25"></audio>
      <audio id="sfx-f2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="9.9" data-duration="0.6" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-a2" class="clip" src="assets/sfx/ping.mp3" data-start="11.3" data-duration="1.32" data-track-index="12" data-volume="0.25"></audio>
      <audio id="sfx-f3" class="clip" src="assets/sfx/pop.mp3" data-start="12.0" data-duration="0.72" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="3.2" data-duration="10.03" data-track-index="14" data-volume="0.15"></audio>
      <audio id="sfx-app" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="13.2" data-duration="2.12" data-track-index="15" data-volume="0.42"></audio>
      <audio id="sfx-shine" class="clip" src="assets/sfx/sparkle.mp3" data-start="13.3" data-duration="1.8" data-track-index="16" data-volume="0.3"></audio>
      <audio id="sfx-twist" class="clip" src="assets/sfx/whoosh.mp3" data-start="15.3" data-duration="0.6" data-track-index="10" data-volume="0.3"></audio>
      <audio id="sfx-big" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="16.9" data-duration="1.5" data-track-index="17" data-volume="0.4"></audio>
      <audio id="sfx-quote" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="18.45" data-duration="0.6" data-track-index="18" data-volume="0.28"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 22;
      const { W, H, C, E, clamp, lerp, tw, kf, rng } = SM;
      const FX = SM.fx, UI = SM.ui;
      let BRAND = "BUSINESS STICKMAN";

      // one order, example numbers: 20% commission on food, 20% cut of the delivery fee
      const COL = { food: "#e08a3c", del: C.teal, fee: "#8a7fd0" };
      const GY = 1240, ZOOM0 = 2.4, ZOOM1 = 3.1, BAR = 6.6, TWIST = 15.3, Q = 18.4;
      const PX = 32, BX = 340, BY = 520, DY = 1060;          // $1 = 32 px; bar top-left; card top
      const DEST = { rest: 210, rider: 540, app: 870 };
      const cash = (n) => "$" + n.toFixed(2);
      // the five money flows: [source from, source to] in dollars along the bar, destination slot
      const appX0 = DEST.app - 2.9 * PX / 2;
      const FLOWS = [
        { s: [0, 8], d: [DEST.rest - 4 * PX, DEST.rest + 4 * PX], col: COL.food, t0: 7.4, t1: 8.9 },
        { s: [8, 10], d: [appX0, appX0 + 2 * PX], col: COL.food, t0: 7.6, t1: 9.0 },
        { s: [10, 11.6], d: [DEST.rider - 0.8 * PX, DEST.rider + 0.8 * PX], col: COL.del, t0: 9.8, t1: 11.2 },
        { s: [11.6, 12], d: [appX0 + 2 * PX, appX0 + 2.4 * PX], col: COL.del, t0: 10.0, t1: 11.3 },
        { s: [12, 12.5], d: [appX0 + 2.4 * PX, appX0 + 2.9 * PX], col: COL.fee, t0: 11.9, t1: 12.9 },
      ];
      const cub = (a, b, c, d, u) => { const v = 1 - u; return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d; };

      function band(ctx, f, t, a) {
        const p = tw(t, f.t0, f.t1, E.inOut);
        if (p <= 0 || a <= 0) return;
        const s0 = BX + f.s[0] * PX, s1 = BX + f.s[1] * PX, [d0, d1] = f.d;
        const y0 = BY + 60, y1 = DY, ym = (y0 + y1) / 2;
        ctx.save(); ctx.globalAlpha *= a;
        ctx.beginPath(); ctx.rect(0, y0 - 2, W, (y1 - y0) * p + 4); ctx.clip();
        ctx.beginPath(); ctx.moveTo(s0, y0); ctx.bezierCurveTo(s0, ym, d0, ym, d0, y1); ctx.lineTo(d1, y1); ctx.bezierCurveTo(d1, ym, s1, ym, s1, y0); ctx.closePath();
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, SM.withA(f.col, 0.9)); g.addColorStop(1, SM.withA(f.col, 0.5));
        ctx.fillStyle = g; ctx.fill();
        ctx.restore();
        // light running down the stream
        const sc = (s0 + s1) / 2, dc = (d0 + d1) / 2;
        for (let i = 0; i < 4; i++) {
          const u = ((t * 0.55 + i / 4) % 1);
          if (u > p) continue;
          const x = cub(sc, sc, dc, dc, u), y = cub(y0, ym, ym, y1, u);
          SM.glow(ctx, x, y, 34, "#fff4d6", 0.5 * a);
        }
        if (p < 1) SM.glow(ctx, cub(sc, sc, dc, dc, p), cub(y0, ym, ym, y1, p), 70, "#fff4d6", 0.7 * a);
      }

      function card(ctx, x, ico, name, amt, k, hi = 0, dim = 0) {
        if (k <= 0) return;
        const w = 290, h = 250, y = DY;
        const sc = E.back(clamp(k));
        ctx.save(); ctx.globalAlpha *= clamp(k * 2) * (1 - dim * 0.65);
        ctx.translate(x, y + h / 2); ctx.scale(sc, sc); ctx.translate(-x, -(y + h / 2));
        if (hi > 0) SM.glow(ctx, x, y + h / 2, 330, C.amber, hi * 0.55);
        SM.rr(ctx, x - w / 2, y, w, h, 30); ctx.fillStyle = "#1d222d"; ctx.fill();
        ctx.lineWidth = hi > 0 ? 4 : 2; ctx.strokeStyle = hi > 0 ? SM.withA(C.amber, 0.4 + 0.5 * hi) : "rgba(255,255,255,0.08)"; ctx.stroke();
        UI.ico(ctx, ico, x, y + 70, 1.6);
        SM.label(ctx, name, x, y + 140, { size: 22, color: C.text });
        SM.text(ctx, cash(amt), x, y + 196, { size: 50, color: hi > 0 ? C.amber : C.hero });
        ctx.restore();
      }

      // frame 0: a rider hands the bag over, the phone shows what you paid
      function street(ctx, t) {
        const sk = ctx.createLinearGradient(0, 0, 0, H);
        sk.addColorStop(0, "#161b28"); sk.addColorStop(0.62, "#23243a"); sk.addColorStop(1, "#0a0c11");
        ctx.fillStyle = sk; ctx.fillRect(-300, -300, W + 600, H + 600);
        SM.glow(ctx, 860, 760, 420, C.amberDeep, 0.25);
        SM.city(ctx, GY - 30, t * 6, 1, 23, 0.25, "#1b1f2c");
        SM.groundStrip(ctx, GY, 700);
        const seat = SM.scooter(ctx, 330, GY, 1.15, { box: true, t });
        const handOff = Math.sin(clamp((t - 0.4) / 1.6) * Math.PI);
        const jr = SM.stickman(ctx, { x: seat[0], y: seat[1], pose: { lean: 0.12, head: 0.1, aB: [1.0, 1.55], aF: [lerp(1.0, 1.45, handOff), lerp(1.5, 1.6, handOff)], lB: [1.5, 0.05], lF: [1.42, -0.05], seat: true }, color: C.hero });
        // helmet
        ctx.save(); ctx.beginPath(); ctx.arc(jr.head[0], jr.head[1] - 3, 31, Math.PI, 0); ctx.closePath(); ctx.lineWidth = 6; ctx.strokeStyle = C.out; ctx.stroke(); ctx.fillStyle = "#3fa36b"; ctx.fill(); ctx.restore();
        const jc = SM.stickman(ctx, { x: 750, y: GY, face: -1, pose: { lean: 0.06, head: 0.15, aB: [0.5, 2.3], aF: [lerp(0.6, 1.3, handOff), lerp(0.4, 1.5, handOff)], lB: [0.14, 0.02], lF: [-0.14, -0.02] }, color: C.other });
        const bx = lerp(jr.handF[0], jc.handF[0], tw(t, 0.8, 1.6, E.inOut)), by = lerp(jr.handF[1], jc.handF[1], tw(t, 0.8, 1.6)) + 30;
        SM.foodBag(ctx, bx, by, 1.1);
        SM.phone(ctx, jc.handB[0], jc.handB[1] - 10, 1.4, 1);
        SM.pill(ctx, "TOTAL $12.50", jc.handB[0], jc.handB[1] - 110, { size: 30, bg: C.amber, fg: "#2a1c00", scale: Math.max(0.001, E.back(tw(t, 0.5, 0.9, E.lin))), alpha: tw(t, 0.5, 0.7) });
        return jc.handB;
      }

      function draw(ctx, t) {
        SM.background(ctx, "#151922", "#08090d");
        const hh = FX.handheld(t, 0.7);

        // ---- scene A, zoom into the phone ----
        if (t < ZOOM1) {
          const zk = tw(t, ZOOM0, ZOOM1, E.in);
          ctx.save();
          SM.camera(ctx, { x: lerp(545, 620, zk) + hh.dx, y: lerp(1010, 1010, zk) + hh.dy, z: lerp(1.25, 6, zk), sx: W / 2, sy: 960 });
          street(ctx, t);
          ctx.restore();
          ctx.fillStyle = `rgba(8,9,13,${tw(t, ZOOM1 - 0.35, ZOOM1, E.lin)})`; ctx.fillRect(0, 0, W, H);
          SM.vignette(ctx, 0.7); SM.grain(ctx, t, 0.05);
          SM.label(ctx, BRAND, W / 2, 1640, { size: 16, color: "rgba(255,255,255,0.2)", spacing: 0.5 });
          return;
        }

        ctx.save(); ctx.translate(hh.dx * 0.5, hh.dy * 0.5);
        const twistOut = 1 - tw(t, TWIST - 0.2, TWIST + 0.3);

        // ---- the receipt ----
        const rk = tw(t, ZOOM1, ZOOM1 + 0.6, E.outQuint) * (1 - tw(t, BAR, BAR + 0.5));
        if (rk > 0) {
          ctx.save(); ctx.globalAlpha *= rk;
          ctx.translate(540, 820); ctx.scale(lerp(0.9, 1, rk), lerp(0.9, 1, rk)); ctx.translate(-540, -820);
          SM.rr(ctx, 160, 470, 760, 700, 40); ctx.fillStyle = "#1a1f2a"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.stroke();
          SM.label(ctx, "YOUR ORDER", 540, 540, { size: 24, color: C.label });
          [["Fried rice", 10, COL.food, 3.6], ["Delivery fee", 2, COL.del, 4.4], ["Service fee", 0.5, COL.fee, 5.2]].forEach(([n, a, c, t0], i) => UI.row(ctx, 210, 640 + i * 100, 660, n, cash(a), c, tw(t, t0, t0 + 0.6, E.lin), { size: 32 }));
          ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(210, 920, 660, 3);
          const tot = tw(t, 6.0, 6.4, E.back);
          UI.bigNumber(ctx, "$12.50", "YOU PAY", 540, 1030, clamp(tot), { size: 110 * lerp(0.8, 1, clamp(tot)), color: C.amber, glowA: 0.45 });
          ctx.restore();
        }

        // ---- the money bar and its five streams ----
        const bk = tw(t, BAR + 0.1, BAR + 0.7, E.outQuint) * twistOut;
        if (bk > 0) {
          ctx.save(); ctx.globalAlpha *= bk;
          SM.label(ctx, "YOUR $12.50", 540, BY - 40, { size: 24, color: C.text });
          const segs = [[0, 10, COL.food], [10, 12, COL.del], [12, 12.5, COL.fee]];
          ctx.save(); SM.rr(ctx, BX, BY, 12.5 * PX * bk, 60, 14); ctx.clip();
          segs.forEach(([a, b, c]) => { ctx.fillStyle = c; ctx.fillRect(BX + a * PX, BY, (b - a) * PX, 60); });
          ctx.restore();
          SM.label(ctx, "FOOD $10", BX + 5 * PX, BY + 31, { size: 22, color: "#2a1600", alpha: tw(t, BAR + 0.5, BAR + 0.8) });
          // tags for the small segments
          const tg = tw(t, BAR + 0.6, BAR + 0.9);
          SM.label(ctx, "$2 DELIVERY", BX + 12.5 * PX + 16, BY + 16, { size: 18, color: COL.del, align: "left", spacing: 0.1, alpha: tg });
          SM.label(ctx, "$0.50 FEE", BX + 12.5 * PX + 16, BY + 46, { size: 18, color: COL.fee, align: "left", spacing: 0.1, alpha: tg });
          ctx.restore();

          FLOWS.forEach((f) => band(ctx, f, t, bk * (1 - 0.6 * tw(t, 13.2, 13.6))));
          // explainers in the middle of the streams
          SM.pill(ctx, "−20% COMMISSION", 800, 790, { size: 24, bg: "#2a2f3b", fg: COL.food, alpha: tw(t, 8.0, 8.3) * (1 - tw(t, 9.5, 9.8)) * bk });
          SM.pill(ctx, "APP TAKES 20%", 760, 880, { size: 24, bg: "#2a2f3b", fg: COL.del, alpha: tw(t, 10.3, 10.6) * (1 - tw(t, 11.7, 12.0)) * bk });
          SM.pill(ctx, "+ SERVICE FEE", 840, 760, { size: 24, bg: "#2a2f3b", fg: COL.fee, alpha: tw(t, 12.0, 12.3) * (1 - tw(t, 13.0, 13.3)) * bk });

          // destination cards
          const ck = tw(t, 7.0, 7.6, E.lin);
          const restA = 8 * tw(t, 8.4, 9.0, E.out);
          const riderA = 1.6 * tw(t, 10.7, 11.3, E.out);
          const appA = 2 * tw(t, 8.5, 9.0, E.out) + 0.4 * tw(t, 10.8, 11.3, E.out) + 0.5 * tw(t, 12.5, 12.9, E.out);
          const hi = tw(t, 13.2, 13.6) * (0.8 + 0.2 * Math.sin(t * 6));
          const dim = tw(t, 13.2, 13.6);
          card(ctx, DEST.rest, "shop", "RESTAURANT", restA, ck, 0, dim);
          card(ctx, DEST.rider, "rider", "RIDER", riderA, tw(t, 7.2, 7.8, E.lin), 0, dim);
          card(ctx, DEST.app, "phoneApp", "THE APP", appA, tw(t, 7.4, 8.0, E.lin), hi, 0);
          // payoff: what the app keeps
          const pk = tw(t, 13.4, 13.9, E.back);
          if (pk > 0) {
            FX.rays(ctx, DEST.app, DY + 125, t, tw(t, 13.2, 13.6) * 0.6, "#ffd27a", 12, 700);
            SM.pill(ctx, "23% OF YOUR ORDER", DEST.app - 110, DY - 70, { size: 28, bg: C.amber, fg: "#2a1c00", scale: Math.max(0.001, pk), alpha: clamp(pk) });
          }
          FX.burst(ctx, DEST.app, DY + 120, t, 13.25, { n: 26, kind: "coin", speed: 700, size: 8, life: 1.4, seed: 5 });
        }

        // ---- twist: every order, millions of times a day ----
        const xk = tw(t, TWIST + 0.1, TWIST + 0.7, E.outQuint) * (1 - tw(t, Q - 0.3, Q + 0.1));
        if (xk > 0) {
          ctx.save(); ctx.globalAlpha *= xk;
          // orders streaming into one phone
          const px = 540, py = 820;
          for (let i = 0; i < 26; i++) {
            const r = rng(i * 13 + 2), side = i % 2 ? 1 : -1;
            const u = ((t - TWIST) * (0.5 + r() * 0.4) + r()) % 1;
            const sx = px + side * (420 + r() * 120), sy = 520 + r() * 640;
            const x = lerp(sx, px, E.in(u)), y = lerp(sy, py, E.in(u));
            UI.ico(ctx, i % 3 ? "bag" : "coin", x, y, 1.1 * (1 - u * 0.6), 1 - u * u);
          }
          SM.glow(ctx, px, py, 300, "#8a7fd0", 0.5);
          ctx.save(); ctx.translate(px, py); ctx.scale(lerp(0.6, 1, xk), lerp(0.6, 1, xk)); UI.ico(ctx, "phoneApp", 0, 0, 5.5); ctx.restore();
          SM.text(ctx, "× 2,000,000 orders a day", 540, 520, { size: 52, color: C.hero, alpha: tw(t, TWIST + 0.4, TWIST + 0.8) });
          const cnt = Math.round(5800000 * tw(t, 15.9, 16.9, E.out) / 1000) * 1000;
          const big = t >= 16.9 ? tw(t, 16.9, 17.3, E.back) : 0;
          UI.bigNumber(ctx, "$" + cnt.toLocaleString("en-US"), big > 0 ? "EVERY DAY · BEFORE THE APP'S OWN COSTS" : "THE APP'S CUT", 540, 1110, tw(t, 15.8, 16.1), { size: 104 * (big > 0 ? lerp(1, 1.06, Math.sin(clamp((t - 16.9) / 0.5) * Math.PI)) : 1), color: big > 0 ? C.amber : C.hero, glowA: big * 0.55 });
          SM.label(ctx, "NO KITCHEN.  NO SCOOTER.  JUST THE CONNECTION.", 540, 1250, { size: 20, color: C.text, alpha: tw(t, 17.2, 17.6) });
          ctx.restore();
        }
        FX.moneyRain(ctx, t, 16.95, { life: 2.2, n: 16 });

        // ---- ending: the network under the quote ----
        const nk = tw(t, Q + 0.2, Q + 0.9, E.outQuint);
        if (nk > 0) {
          ctx.save(); ctx.globalAlpha *= nk;
          const cx = 540, cy = 1000;
          const nodes = [];
          for (let i = 0; i < 12; i++) { const a = -Math.PI / 2 + (i / 12) * Math.PI * 2 + 0.26; nodes.push([cx + Math.cos(a) * 330 * nk, cy + Math.sin(a) * 260 * nk, i % 2 ? "shop" : "rider"]); }
          nodes.forEach(([x, y], i) => {
            ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(cx, cy); ctx.stroke();
            const u = ((t * 0.8 + i / 12) % 1);
            SM.coin(ctx, lerp(x, cx, u), lerp(y, cy, u), 9, t * 3 + i, 1 - u * 0.5);
          });
          nodes.forEach(([x, y, ic]) => { SM.circle(ctx, x, y, 46, "#1d222d", 3); UI.ico(ctx, ic, x, y, 1.0); });
          FX.rays(ctx, cx, cy, t, 0.45, "#ffd27a", 12, 520);
          SM.glow(ctx, cx, cy, 240, C.amber, 0.5 + 0.1 * Math.sin(t * 4));
          SM.circle(ctx, cx, cy, 90, "#232834", 5); UI.ico(ctx, "phoneApp", cx, cy, 2.4);
          ctx.restore();
        }
        ctx.restore();

        // ---- chrome ----
        UI.topic(ctx, "HOW A DELIVERY APP MAKES MONEY", 196, tw(t, 3.1, 3.5));
        SM.label(ctx, "EXAMPLE NUMBERS · FEES VARY BY APP AND CITY", W / 2, 1360, { size: 15, color: "rgba(255,255,255,0.45)", spacing: 0.12, alpha: tw(t, 3.6, 4.0) * (1 - tw(t, Q - 0.3, Q)) });
        SM.label(ctx, BRAND, W / 2, 1640, { size: 16, color: "rgba(255,255,255,0.2)", spacing: 0.5 });
        FX.leak(ctx, t, 0.1 + tw(t, 13.2, 13.6) * 0.22 * (1 - tw(t, 14.6, 15.3)));
        SM.vignette(ctx, 0.65);
        SM.grain(ctx, t, 0.05);
      }

      document.fonts.load('800 40px "Jakarta"').then(() => {
        try { const v = window.__hyperframes.getVariables(); if (v && v.brand) BRAND = v.brand; } catch (e) {}
        tl.fromTo("#hook-l1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
        tl.fromTo("#hook-l2", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.7);
        tl.fromTo("#hook p", { opacity: 1, y: 0 }, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.4, ease: "power3.in", stagger: 0.06 }, 2.45);
        tl.fromTo("#quote .q", { opacity: 0, filter: "blur(12px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.55, ease: "power4.out", stagger: 0.4 }, 18.5);
        tl.fromTo("#quote .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 19.4);
        SM.mount("stage", DUR, draw, tl);
        window.__timelines["main"] = tl;
      });
    </script>
