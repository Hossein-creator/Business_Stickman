<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Jakarta"; src: url("../../shared/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
<script src="../../shared/lib/stickman.js"></script>
<script src="../../shared/lib/stickman-props.js"></script>
<script src="../../shared/lib/stickman-fx.js"></script>
<script src="../../shared/lib/stickman-ui.js"></script>
</head><body>
<canvas id="c"></canvas>
<script>
  // Brand kit for the Instagram profile: ?which=avatar | start | ideas | breakdowns | habits
  const { C } = SM;
  const which = new URLSearchParams(location.search).get("which") || "avatar";
  const cv = document.getElementById("c");
  const S = 1080;
  cv.width = S; cv.height = S;
  const ctx = cv.getContext("2d");

  function night() {
    const g = ctx.createLinearGradient(0, 0, 0, S);
    g.addColorStop(0, "#1b202b"); g.addColorStop(1, "#0a0c11");
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  }

  const draw = {
    avatar() {
      night();
      SM.glow(ctx, 600, 520, 480, C.amber, 0.6);
      const j = SM.stickman(ctx, { x: 370, y: 1070, s: 3.4, pose: SM.POSE.give });
      SM.coin(ctx, j.handF[0] + 120, j.handF[1] - 40, 120);
    },
    start() { night(); SM.glow(ctx, S / 2, S / 2, 460, C.amber, 0.45); SM.ui.ico(ctx, "play", S / 2, S / 2, 7); },
    ideas() { night(); SM.glow(ctx, S / 2, S / 2, 460, C.amber, 0.45); SM.cart(ctx, S / 2, 760, 1.9); },
    breakdowns() { night(); SM.glow(ctx, S / 2, S / 2, 460, C.amber, 0.45); SM.ui.ico(ctx, "shop", S / 2, S / 2, 7); },
    habits() { night(); SM.glow(ctx, S / 2, S / 2, 460, C.amber, 0.45); SM.coin(ctx, S / 2, S / 2, 170); },
  };
  document.fonts.ready.then(() => { draw[which](); document.body.dataset.ready = "1"; });
</script>
</body></html>
